# syntax=ghcr.io/project-dalec/dalec/frontend@sha256:<dalec-frontend-digest>
# Base fixture: the integration helper injects the dalec-homebrew child mapping before building.

name: homebrew-ci-noncore-multi-package
version: 0.1.0
revision: 1
description: CI validation image with public-tap and core Homebrew packages
website: https://brew.sh/
license: Apache-2.0

dependencies:
  runtime:
    svt/avtools/libdf: {}
    sozercan/repo/a365: {}
    hello: {}

image:
  entrypoint: /home/linuxbrew/.linuxbrew/bin/hello
  user: linuxbrew

tests:
  - name: noncore-multi-package-runtime
    steps:
      - command: hello
        stdout:
          contains: ["Hello, world!"]
      - command: test -s /home/linuxbrew/.linuxbrew/opt/libdf/lib/libdf.so && echo libdf-ok
        stdout:
          equals: "libdf-ok\n"
      - command: a365 --version
        stdout:
          matches: ['[0-9]+\.[0-9]+\.[0-9]+']
    files:
      /home/linuxbrew/.linuxbrew/bin/hello: {}
      /home/linuxbrew/.linuxbrew/opt/libdf/lib/libdf.so: {}
      /home/linuxbrew/.linuxbrew/bin/a365: {}
      /home/linuxbrew/.linuxbrew/bin/brew:
        not_exist: true
      /home/linuxbrew/.linuxbrew/Homebrew:
        not_exist: true
      /home/linuxbrew/.cache/Homebrew:
        not_exist: true
      /usr/share/dalec-homebrew/resolution.json:
        contains:
          - dalec-homebrew-resolution/v2
          - svt/avtools/libdf
          - sozercan/repo/a365
          - homebrew/core/hello
