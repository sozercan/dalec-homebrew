# syntax=ghcr.io/project-dalec/dalec/frontend@sha256:<dalec-frontend-digest>
name: hello-runtime
description: GNU hello from a verified Homebrew bottle
website: https://www.gnu.org/software/hello/
version: 0.1.0
revision: 1
license: Apache-2.0

x-dalec-homebrew:
  schema_version: dalec-homebrew-forwarding/v1
  target: homebrew
  runtime_dependency_order: [hello]

dependencies:
  runtime:
    hello: {}

image:
  entrypoint: /home/linuxbrew/.linuxbrew/bin/hello

tests:
  - name: hello
    steps:
      - command: hello
        stdout:
          contains: ["Hello, world!"]
    files:
      /home/linuxbrew/.linuxbrew/bin/hello: {}

targets:
  homebrew:
    frontend:
      image: ghcr.io/sozercan/dalec-homebrew@sha256:<dalec-homebrew-digest>
