# syntax=ghcr.io/project-dalec/dalec/frontend@sha256:37f3a2ab5b7e65b3f8c5cb4e79f9f184f8d2b7e7d3f328041d7d22d160805c8c
# Base fixture: the integration helper pins the release-tested upstream Dalec
# frontend and injects targets.homebrew.frontend.image before building homebrew/image.

name: homebrew-live-runtime
description: Live integration image with GNU hello and jq from verified Homebrew bottles
website: https://brew.sh/
version: 0.1.0
revision: 1
license: Apache-2.0

dependencies:
  runtime:
    hello: {}
    jq: {}

image:
  entrypoint: /home/linuxbrew/.linuxbrew/bin/hello
  user: linuxbrew

tests:
  - name: runtime-commands
    steps:
      - command: hello
        stdout:
          contains: ["Hello, world!"]
      - command: jq --version
        stdout:
          starts_with: "jq-"
    files:
      /home/linuxbrew/.linuxbrew/bin/hello: {}
      /home/linuxbrew/.linuxbrew/bin/jq: {}
      /home/linuxbrew/.linuxbrew/bin/brew:
        not_exist: true
