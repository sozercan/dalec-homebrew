# syntax=ghcr.io/project-dalec/dalec/frontend@sha256:37f3a2ab5b7e65b3f8c5cb4e79f9f184f8d2b7e7d3f328041d7d22d160805c8c
# Base fixture: the integration helper pins the release-tested upstream Dalec
# frontend and injects targets.homebrew.frontend.image before building homebrew/image.

name: homebrew-live-python-curl
version: 0.1.0
revision: 1
description: Offline runtime validation for Python and curl with transitive libpsl
website: https://brew.sh/
license: Apache-2.0

dependencies:
  runtime:
    curl: {}
    python@3.14: {}

image:
  entrypoint: /home/linuxbrew/.linuxbrew/bin/python3.14
  user: linuxbrew

tests:
  - name: python-curl-runtime-closure
    env:
      HOMEBREW_PREFIX: /home/linuxbrew/.linuxbrew
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - command: |
          set -eu
          python3.14 -c 'import ssl; assert ssl.create_default_context().get_ca_certs()'
          curl --version > /tmp/curl-version
          grep -q '^curl ' /tmp/curl-version
          test "$(id -u):$(id -g)" = "1000:1000"
          test ! -e "$HOMEBREW_PREFIX/bin/psl-make-dafsa"
          helper="$(find "$HOMEBREW_PREFIX/Cellar/libpsl" -path '*/bin/psl-make-dafsa' -type f -print -quit)"
          test -n "$helper"
          test "$(sed -n '1p' "$helper")" = '#!/usr/bin/env python'
          echo python-curl-runtime-closure-ok
        stdout:
          equals: "python-curl-runtime-closure-ok\n"
    files:
      /home/linuxbrew/.linuxbrew/bin/python3.14: {}
      /home/linuxbrew/.linuxbrew/bin/curl: {}
      /home/linuxbrew/.linuxbrew/bin/psl-make-dafsa:
        not_exist: true
      /home/linuxbrew/.linuxbrew/bin/brew:
        not_exist: true
