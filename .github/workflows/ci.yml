name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.9
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/homebrew/metadata ./internal/homebrew/oci ./internal/bottle ./internal/resolution ./internal/runtimefs ./internal/testrunner
      - name: Cross-compile release binaries
        run: |
          set -eux
          for arch in amd64 arm64; do
            for cmd in frontend materializer record-verify release-verify test-runner resolve; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o /tmp/dalec-homebrew-${cmd}-${arch} ./cmd/${cmd}
            done
          done

  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build static helper stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: go-build
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
