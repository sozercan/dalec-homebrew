name: ci

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to validate
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILDX_VERSION: v0.36.0
  BUILDX_SHA256_AMD64: 07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99
  BUILDX_SHA256_ARM64: 70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  REGISTRY_IMAGE: docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: ./scripts/check.sh
      - run: make build
      - run: git diff --check

  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install checksum-pinned Buildx
        run: |
          set -euo pipefail
          [[ "$BUILDX_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$(uname -m)" in
            x86_64|amd64)
              arch=amd64
              expected=$BUILDX_SHA256_AMD64
              ;;
            aarch64|arm64)
              arch=arm64
              expected=$BUILDX_SHA256_ARM64
              ;;
            *)
              echo "unsupported Buildx host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          asset="buildx-${BUILDX_VERSION}.linux-${arch}"
          binary="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-filesize 134217728 \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/${asset}" \
            --output "$binary"
          printf '%s  %s\n' "$expected" "$binary" | sha256sum -c -
          plugin_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          install -d -m 0755 "$plugin_dir"
          install -m 0755 "$binary" "$plugin_dir/docker-buildx"
          docker buildx version | grep -F " $BUILDX_VERSION "

      - name: Validate release inputs
        run: |
          set -euo pipefail
          ./scripts/release-inputs.sh > "$RUNNER_TEMP/release-inputs.json"
          jq -e '.schema_version == "dalec-homebrew-release-inputs/v2"' \
            "$RUNNER_TEMP/release-inputs.json"

      - name: Validate upstream Dalec forwarding pin
        run: |
          set -euo pipefail
          go run ./cmd/live-input-verify \
            --dalec-frontend-file release/dalec-frontend.json \
            > "$RUNNER_TEMP/dalec-frontend-selection.json"
          jq -e '
            .route == "homebrew/image" and
            (.index | test("@sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/dalec-frontend-selection.json"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        run: |
          set -euo pipefail
          builder="${GITHUB_JOB//_/-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use \
            --bootstrap
      - run: docker buildx bake --print release-children frontend
      - name: Build gateway frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: frontend
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 materializer compatibility image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: materializer
          platforms: linux/amd64
          load: true
          tags: dalec-homebrew-materializer:compat-amd64
          build-args: RUNTIME_BASE=docker.io/library/ubuntu@sha256:52df9b1ee71626e0088f7d400d5c6b5f7bb916f8f0c82b474289a4ece6cf3faf
          provenance: false
          cache-from: type=gha,scope=materializer-compat-amd64
          cache-to: type=gha,mode=max,scope=materializer-compat-amd64
      - name: Check amd64 pinned Homebrew compatibility
        run: |
          set -euo pipefail
          ./scripts/materializer-compat.sh \
            --image dalec-homebrew-materializer:compat-amd64 \
            --platform linux/amd64
          ./scripts/materializer-compat.sh \
            --image dalec-homebrew-materializer:compat-amd64 \
            --platform linux/amd64 \
            --current
      - name: Build arm64 materializer compatibility image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: materializer
          platforms: linux/arm64
          load: true
          tags: dalec-homebrew-materializer:compat-arm64
          build-args: RUNTIME_BASE=docker.io/library/ubuntu@sha256:7f622ca8766bccb22f04242ecb6f19f770b2f08827dc4b8c707de5e78a6da7ab
          provenance: false
          cache-from: type=gha,scope=materializer-compat-arm64
          cache-to: type=gha,mode=max,scope=materializer-compat-arm64
      - name: Check arm64 pinned Homebrew compatibility
        run: |
          set -euo pipefail
          ./scripts/materializer-compat.sh \
            --image dalec-homebrew-materializer:compat-arm64 \
            --platform linux/arm64
          ./scripts/materializer-compat.sh \
            --image dalec-homebrew-materializer:compat-arm64 \
            --platform linux/arm64 \
            --current

  e2e:
    name: Non-core multi-package container E2E
    needs: [go, dockerfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install checksum-pinned Buildx
        run: |
          set -euo pipefail
          [[ "$BUILDX_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$(uname -m)" in
            x86_64|amd64)
              arch=amd64
              expected=$BUILDX_SHA256_AMD64
              ;;
            aarch64|arm64)
              arch=arm64
              expected=$BUILDX_SHA256_ARM64
              ;;
            *)
              echo "unsupported Buildx host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          asset="buildx-${BUILDX_VERSION}.linux-${arch}"
          binary="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-filesize 134217728 \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/${asset}" \
            --output "$binary"
          printf '%s  %s\n' "$expected" "$binary" | sha256sum -c -
          plugin_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          install -d -m 0755 "$plugin_dir"
          install -m 0755 "$binary" "$plugin_dir/docker-buildx"
          docker buildx version | grep -F " $BUILDX_VERSION "

      - name: Build and test upstream-forwarded build-local non-core V2
        env:
          DALEC_HOMEBREW_E2E_BUILDKIT_IMAGE: ${{ env.BUILDKIT_IMAGE }}
          DALEC_HOMEBREW_E2E_REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DALEC_HOMEBREW_E2E_DALEC_FRONTEND_PIN: release/dalec-frontend.json
          DALEC_HOMEBREW_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DALEC_HOMEBREW_E2E_IMAGE: dalec-homebrew-noncore-e2e:${{ github.sha }}
          DALEC_HOMEBREW_E2E_SPEC: examples/ci-noncore-multi-package.yaml
          DALEC_HOMEBREW_E2E_PROGRESS: plain
        run: ./scripts/noncore-e2e.sh
