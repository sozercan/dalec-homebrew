                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError as exc:
                  raise SystemExit(f"{label} is invalid: {exc}") from exc
              if parsed.tzinfo is None:
                  raise SystemExit(f"{label} has no timezone")
              return int(parsed.timestamp())

          expected_specs = os.environ["RELEASE_SPECS"].split()
          expected = [(spec, platform) for spec in expected_specs for platform in ("linux/amd64", "linux/arm64")]
          expected.extend(
              (spec, "linux/amd64")
              for spec in os.environ["RELEASE_AMD64_ONLY_SPECS"].split()
          )
          observations = document["observations"]
          actual = [(item["spec"], item["platform"]) for item in observations]
          if actual != expected or len(actual) != len(set(actual)):
              raise SystemExit("metadata observations do not exactly match the release spec/platform inventory")
          for item in observations:
              observed_epoch = epoch(item["generated_at"], "metadata observation generated_at")
              if observed_epoch != item["core_generated_at_epoch"]:
                  raise SystemExit("metadata observation epoch does not match generated_at")
          accepted = document["accepted_snapshot"]
          accepted_epoch = epoch(accepted["generated_at"], "accepted metadata generated_at")
          earliest = min(observations, key=lambda item: (item["core_generated_at_epoch"], item["generated_at"]))
          if (
              accepted["generated_at"] != earliest["generated_at"]
              or accepted["source_date_epoch"] != accepted_epoch
              or accepted_epoch != earliest["core_generated_at_epoch"]
              or accepted["formula_envelope_digest"] != earliest["formula_envelope_digest"]
              or accepted["migration_envelope_digest"] != earliest["migration_envelope_digest"]
          ):
              raise SystemExit("accepted metadata snapshot is not the earliest observed core snapshot")
          observed_values = {item["generated_at"] for item in observations}
          if len(observed_values) != 1 and accepted["generated_at_source"] != "http-last-modified":
              raise SystemExit("signed metadata generated_at differs across release integrations")
          PYTIME
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            --slurpfile digests dist/release/digests.json \
            --slurpfile inputs dist/release/inputs.json '
            ($inputs[0].dalec_frontend.index
              | capture("^(?<repository>[^@]+)@sha256:(?<digest>[0-9a-f]{64})$")) as $dalec_frontend
            | .builder.id == "https://github.com/actions/runner" and
            .buildType == ("https://github.com/" + $repository + "/.github/workflows/release.yml@v1") and
            .invocation.configSource.uri == ("git+https://github.com/" + $repository + "@refs/heads/main") and
            (.invocation.configSource.digest.sha1 | type == "string" and test("^[0-9a-f]{40}$")) and
            .invocation.configSource.digest.sha1 == $sha and
            .invocation.configSource.entryPoint == ".github/workflows/release.yml" and
            .invocation.parameters.tag == $tag and
            .invocation.parameters.source_date_epoch == $inputs[0].source_date_epoch and
            .invocation.parameters.metadata_bundle_digest == $inputs[0].metadata_bundle_digest and
            .invocation.parameters.dalec_frontend == $inputs[0].dalec_frontend and
            .invocation.parameters.buildx_version == env.BUILDX_VERSION and
            .invocation.parameters.buildx_sha256_amd64 == env.BUILDX_SHA256_AMD64 and
            .invocation.parameters.buildx_sha256_arm64 == env.BUILDX_SHA256_ARM64 and
            .invocation.parameters.buildkit_image == env.BUILDKIT_IMAGE and
            .invocation.parameters.binfmt_image == env.BINFMT_IMAGE and
            .invocation.parameters.syft_image == env.SYFT_IMAGE and
            .invocation.parameters.trivy_image == env.TRIVY_IMAGE and
            .invocation.parameters.workflow_ref == "refs/heads/main" and
            .invocation.parameters.workflow_sha == .invocation.configSource.digest.sha1 and
            (.invocation.environment | type == "object" and length == 0) and
            .metadata.buildInvocationId == $digests[0].source.build_invocation and
            .metadata.completeness == {parameters: false, environment: false, materials: false} and
            .metadata.reproducible == false and
            (.materials | length) == 2 and
            .materials[0].uri == ("git+https://github.com/" + $repository + "@refs/tags/" + $tag) and
            .materials[0].digest == {sha1: $sha} and
            .materials[1].uri == ("oci://" + $dalec_frontend.repository) and
            .materials[1].digest == {sha256: $dalec_frontend.digest}
          ' dist/release/provenance.json >/dev/null
          workflow_sha=$(jq -er .invocation.configSource.digest.sha1 dist/release/provenance.json)
          build_invocation=$(jq -er .metadata.buildInvocationId dist/release/provenance.json)
          build_invocation_prefix="https://github.com/$GITHUB_REPOSITORY/actions/runs/"
          if [[ "$build_invocation" != "$build_invocation_prefix"* ]]; then
            echo "provenance build invocation is not a release workflow run" >&2
            exit 1
          fi
          build_invocation_suffix=${build_invocation#"$build_invocation_prefix"}
          if [[ ! "$build_invocation_suffix" =~ ^([0-9]+)/attempts/([0-9]+)$ ]]; then
            echo "provenance build invocation is not a release workflow run" >&2
            exit 1
          fi
          run_id=${BASH_REMATCH[1]}
          run_attempt=${BASH_REMATCH[2]}
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt")
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$workflow_sha" \
            --argjson run_id "$run_id" \
            --argjson run_attempt "$run_attempt" '
            .id == $run_id and
            .run_attempt == $run_attempt and
            (.event == "repository_dispatch" or .event == "workflow_dispatch") and
            .head_branch == "main" and
            .head_sha == $workflow_sha and
            (.path == ".github/workflows/release.yml" or
             .path == ".github/workflows/release.yml@main" or
             .path == ".github/workflows/release.yml@refs/heads/main") and
            .repository.full_name == $repository
          ' <<<"$run_json" >/dev/null

      - name: Pin source state and validate release tags before signing
        run: |
          set -euo pipefail
          build_invocation=$(jq -er .metadata.buildInvocationId dist/release/provenance.json)
          build_invocation_prefix="https://github.com/$GITHUB_REPOSITORY/actions/runs/"
          if [[ "$build_invocation" != "$build_invocation_prefix"* ]]; then
            echo "provenance build invocation is not a release workflow run" >&2
            exit 1
          fi
          build_invocation_suffix=${build_invocation#"$build_invocation_prefix"}
          if [[ ! "$build_invocation_suffix" =~ ^([0-9]+)/attempts/([0-9]+)$ ]]; then
            echo "provenance build invocation is not a release workflow run" >&2
            exit 1
          fi
          [[ "${BASH_REMATCH[1]}" == "$GITHUB_RUN_ID" ]] || {
            echo "provenance run ${BASH_REMATCH[1]} does not match signing run $GITHUB_RUN_ID" >&2
            exit 1
          }
          claimed_attempt=${BASH_REMATCH[2]}
          (( claimed_attempt >= 1 && claimed_attempt <= GITHUB_RUN_ATTEMPT )) || {
            echo "provenance attempt $claimed_attempt is not valid for signing attempt $GITHUB_RUN_ATTEMPT" >&2
            exit 1
          }

          resolve_release_tag() {
            local object object_type actual
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG") || return 1
            object_type=$(jq -er '.object.type' <<<"$object") || return 1
            actual=$(jq -er '.object.sha' <<<"$object") || return 1
            for _ in $(seq 1 8); do
              [[ "$object_type" == tag ]] || break
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual") || return 1
              object_type=$(jq -er '.object.type' <<<"$object") || return 1
              actual=$(jq -er '.object.sha' <<<"$object") || return 1
            done
            [[ "$object_type" == commit && "$actual" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$actual"
          }
          pinned_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha | select(test("^[0-9a-f]{40}$"))')
          actual_release_sha=$(resolve_release_tag) || {
            echo "refs/tags/$RELEASE_TAG no longer resolves to a commit" >&2
            exit 1
          }
          [[ "$actual_release_sha" == "$RELEASE_SHA" ]] || {
            echo "refs/tags/$RELEASE_TAG moved from $RELEASE_SHA to $actual_release_sha" >&2
            exit 1
          }
          source_comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$pinned_main_sha" --jq .status)
          if [[ "$source_comparison" != ahead && "$source_comparison" != identical ]]; then
            echo "$RELEASE_TAG is not reachable from pinned main $pinned_main_sha (comparison: $source_comparison)" >&2
            exit 1
          fi
          workflow_sha=$(jq -er .invocation.configSource.digest.sha1 dist/release/provenance.json)
          workflow_comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$workflow_sha...$pinned_main_sha" --jq .status)
          if [[ "$workflow_comparison" != ahead && "$workflow_comparison" != identical ]]; then
            echo "provenance workflow commit $workflow_sha is not reachable from pinned main $pinned_main_sha" >&2
            exit 1
          fi
          export PINNED_MAIN_SHA="$pinned_main_sha"
          echo "PINNED_MAIN_SHA=$pinned_main_sha" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/require-signing-context" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_main_sha" == "$PINNED_MAIN_SHA" ]] || {
            echo "main moved from pinned commit $PINNED_MAIN_SHA to $current_main_sha" >&2
            exit 1
          }
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          object_type=$(jq -er '.object.type' <<<"$object")
          actual=$(jq -er '.object.sha' <<<"$object")
          for _ in $(seq 1 8); do
            [[ "$object_type" == tag ]] || break
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual")
            object_type=$(jq -er '.object.type' <<<"$object")
            actual=$(jq -er '.object.sha' <<<"$object")
          done
          [[ "$object_type" == commit && "$actual" == "$RELEASE_SHA" ]] || {
            echo "refs/tags/$RELEASE_TAG no longer resolves to $RELEASE_SHA" >&2
            exit 1
          }
          BASH
          chmod 0700 "$RUNNER_TEMP/require-signing-context"

          read_registry_digest() {
            local ref=$1 descriptor digest attempt error_file errors_file all_missing
            errors_file=$(mktemp "$RUNNER_TEMP/registry-inspect.XXXXXX")
            all_missing=true
            for attempt in $(seq 1 5); do
              error_file=$(mktemp "$RUNNER_TEMP/registry-inspect-attempt.XXXXXX")
              if descriptor=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$error_file"); then
                if digest=$(jq -er 'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor" 2>>"$errors_file"); then
                  rm -f "$error_file" "$errors_file"
                  printf '%s\n' "$digest"
                  return 0
                fi
                all_missing=false
                printf 'malformed manifest descriptor for %s:\n%s\n' "$ref" "$descriptor" >> "$errors_file"
              else
                {
                  printf 'attempt %s for %s:\n' "$attempt" "$ref"
                  cat "$error_file"
                } >> "$errors_file"
                if ! cmp -s "$error_file" <(printf 'ERROR: %s: not found\n' "$ref"); then
                  all_missing=false
                fi
              fi
              rm -f "$error_file"
              sleep $((attempt * 2))
            done
            if [[ "$all_missing" == true ]]; then
              rm -f "$errors_file"
              return 3
            fi
            cat "$errors_file" >&2
            rm -f "$errors_file"
            return 1
          }
          for component in runtime-base bottle-fetcher catalog-extractor materializer frontend; do
            repository=$(jq -er --arg component "$component" '.components[$component].repository' dist/release/digests.json)
            digest=$(jq -er --arg component "$component" '.components[$component].index' dist/release/digests.json)
            if existing=$(read_registry_digest "$repository:$RELEASE_TAG"); then
              [[ "$existing" == "$digest" ]] || {
                echo "immutable release tag $repository:$RELEASE_TAG already points to $existing, not $digest" >&2
                exit 1
              }
            else
              status=$?
              (( status == 3 )) || {
                echo "could not safely inspect immutable release tag $repository:$RELEASE_TAG" >&2
                exit "$status"
              }
            fi
          done

      - name: Sign images and attach provenance and SBOM attestations
        run: |
          set -euo pipefail

          subjects_file="$RUNNER_TEMP/release-subjects"
          jq -r '
            .components[]
            | .repository as $repository
            | ($repository + "@" + .index),
              (.platforms[] | $repository + "@" + .)
          ' dist/release/digests.json | sort -u > "$subjects_file"
          mapfile -t subjects < "$subjects_file"
          (( ${#subjects[@]} == 15 ))

          for subject in "${subjects[@]}"; do
            "$RUNNER_TEMP/require-signing-context"
            cosign sign --yes "$subject"
            "$RUNNER_TEMP/require-signing-context"
            cosign attest --yes \
              --type slsaprovenance02 \
              --predicate dist/release/provenance.json \
              "$subject"
          done

          platform_subjects_file="$RUNNER_TEMP/release-platform-subjects"
          jq -r '
            .components
            | to_entries[]
            | .key as $component
            | .value.repository as $repository
            | .value.platforms
            | to_entries[]
            | [$component, .key, ($repository + "@" + .value)]
            | @tsv
          ' dist/release/digests.json > "$platform_subjects_file"
          platform_subject_count=0
          while IFS=$'\t' read -r component platform subject; do
            platform_subject_count=$((platform_subject_count + 1))
            slug="${component}-${platform//\//-}"
            predicate="dist/release/evidence/sbom-${slug}.spdx.json"
            vulnerability="dist/release/evidence/vulnerability-${slug}.json"
            test -s "$predicate"
            # Vulnerability reports are checksum-signed release assets; only SPDX is attached as an image attestation.
            test -s "$vulnerability"
            "$RUNNER_TEMP/require-signing-context"
            cosign attest --yes \
              --type spdxjson \
              --predicate "$predicate" \
              "$subject"
          done < "$platform_subjects_file"
          (( platform_subject_count == 10 ))

      - name: Flatten release evidence
        run: |
          set -euo pipefail
          find dist/release/evidence -maxdepth 1 -type f -exec mv {} dist/release/ \;
          find dist/release/runtime-evidence -maxdepth 1 -type f -exec mv {} dist/release/ \;
          rmdir dist/release/evidence dist/release/runtime-evidence
          test -s dist/release/metadata-bundle/manifest.json
          test -s dist/release/metadata-bundle/formula.jws.json
          test -s dist/release/metadata-bundle/formula_tap_migrations.jws.json
          test -s dist/release/metadata-bundle.digest
          mv dist/release/metadata-bundle/manifest.json dist/release/metadata-bundle-manifest.json
          mv dist/release/metadata-bundle/formula.jws.json dist/release/metadata-formula.jws.json
          mv dist/release/metadata-bundle/formula_tap_migrations.jws.json dist/release/metadata-migrations.jws.json
          rmdir dist/release/metadata-bundle

      - name: Sign release records
        run: |
          set -euo pipefail
          checksums="$RUNNER_TEMP/SHA256SUMS"
          (
            cd dist/release
            find . -type f ! -name '*.bundle' ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > "$checksums"
          )
          mv "$checksums" dist/release/SHA256SUMS
          "$RUNNER_TEMP/require-signing-context"
          cosign sign-blob --yes \
            --bundle dist/release/components.json.bundle \
            dist/release/components.json
          "$RUNNER_TEMP/require-signing-context"
          cosign sign-blob --yes \
            --bundle dist/release/metadata-snapshot.json.bundle \
            dist/release/metadata-snapshot.json
          "$RUNNER_TEMP/require-signing-context"
          cosign sign-blob --yes \
            --bundle dist/release/SHA256SUMS.bundle \
            dist/release/SHA256SUMS

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/release
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  promote:
    name: Promote tested digests
    needs: [prepare, release_target, sign]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.release_target.result == 'success' &&
      (needs.sign.result == 'success' ||
       (needs.release_target.outputs.state == 'draft' && needs.sign.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_STATE: ${{ needs.release_target.outputs.state }}
      STABLE: ${{ needs.prepare.outputs.stable }}
    steps:
      - name: Check out trusted verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download newly signed release bundle
        if: needs.release_target.outputs.state == 'absent'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/release

      - name: Download signed draft bundle
        if: needs.release_target.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_prerelease=false
          [[ "$STABLE" == true ]] || expected_prerelease=true
          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,isPrerelease,tagName)
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$expected_prerelease" '
              .tagName == $tag and
              .isDraft == true and
              .isPrerelease == $prerelease and
              (.databaseId | type == "number" and . > 0)
            ' <<<"$release_json" >/dev/null
          release_id=$(jq -er .databaseId <<<"$release_json")
          uploaded_assets=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")
          jq -e \
            --argjson max_asset "$MAX_RELEASE_ASSET_BYTES" \
            --argjson max_total "$MAX_RELEASE_TOTAL_BYTES" '
              [.[][] | {name, digest, state, size}]
              | length > 0 and length <= 200
              and all(.[];
                (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$"))
                and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                and .state == "uploaded"
                and (.size | type == "number" and . >= 0 and . <= $max_asset))
              and ([.[].size] | add <= $max_total)
              and ([.[].name] | length == (unique | length))
            ' <<<"$uploaded_assets" >/dev/null
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/release

      - name: Install checksum-pinned Buildx
        run: *install-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify signed bundle checksums
        env:
          CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/heads/main$
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/release/SHA256SUMS.bundle \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            dist/release/SHA256SUMS

          contract_names=$(mktemp "$RUNNER_TEMP/release-contract.XXXXXX")
          expected_names=$(mktemp "$RUNNER_TEMP/signed-assets-expected.XXXXXX")
          actual_names=$(mktemp "$RUNNER_TEMP/signed-assets-actual.XXXXXX")
          read -r -a specs <<< "$RELEASE_SPECS"
          (( ${#specs[@]} > 0 ))
          read -r -a amd64_only_specs <<< "$RELEASE_AMD64_ONLY_SPECS"
          (( ${#amd64_only_specs[@]} > 0 ))
          {
            printf '%s\n' \
              components.digest \
              components.json \
              components.json.bundle \
              digests.json \
              inputs.json \
              metadata-bundle.digest \
              metadata-bundle-manifest.json \
              metadata-formula.jws.json \
              metadata-migrations.jws.json \
              metadata-snapshot.json \
              metadata-snapshot.json.bundle \
              provenance.json \
              SHA256SUMS \
              SHA256SUMS.bundle
            for component in frontend runtime-base bottle-fetcher catalog-extractor materializer; do
              for platform in linux-amd64 linux-arm64; do
                printf 'sbom-%s-%s.spdx.json\n' "$component" "$platform"
                printf 'vulnerability-%s-%s.json\n' "$component" "$platform"
              done
            done
            for platform in linux-amd64 linux-arm64; do
              for spec in "${specs[@]}"; do
                printf 'runtime-evidence-%s-%s.tar.gz\n' "$platform" "$spec"
              done
            done
            for spec in "${amd64_only_specs[@]}"; do
              printf 'runtime-evidence-linux-amd64-%s.tar.gz\n' "$spec"
            done
          } | sort > "$contract_names"
          expected_contract_count=$((34 + 2 * ${#specs[@]} + ${#amd64_only_specs[@]}))
          (( $(wc -l < "$contract_names") == expected_contract_count ))
          (
            cd dist/release
            awk '
              NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ ||
                $2 !~ /^\.\/[A-Za-z0-9][A-Za-z0-9._-]{0,255}$/ { exit 1 }
              {
                name = substr($2, 3)
                if (seen[name]++) exit 1
                print name
              }
            ' SHA256SUMS > "$expected_names"
            printf '%s\n' \
              components.json.bundle \
              metadata-snapshot.json.bundle \
              SHA256SUMS \
              SHA256SUMS.bundle >> "$expected_names"
            sort -u -o "$expected_names" "$expected_names"
            find . -maxdepth 1 -type f -print | sed 's#^\./##' | sort > "$actual_names"
            diff -u "$contract_names" "$expected_names"
            diff -u "$contract_names" "$actual_names"
            sha256sum -c SHA256SUMS
          )

      - name: Validate signed release tuple
        run: *validate-release-tuple

      - name: Revalidate runtime evidence and metadata snapshot
        run: *validate-runtime-evidence

      - name: Revalidate vulnerability reports
        run: *validate-vulnerability-reports

      - name: Reverify release signatures and attestations
        env:
          CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/heads/main$
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/release/components.json.bundle \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            dist/release/components.json
          cosign verify-blob \
            --bundle dist/release/metadata-snapshot.json.bundle \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            dist/release/metadata-snapshot.json
          verify_attestation_predicate() {
            local type=$1 subject=$2 predicate=$3 output
            output=$(mktemp "$RUNNER_TEMP/verified-attestations.XXXXXX")
            cosign verify-attestation \
              --type "$type" \
              --output text \
              --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              "$subject" > "$output"
            jq -s -e --slurpfile expected "$predicate" '
              def predicate:
                if has("payload") then (.payload | @base64d | fromjson | .predicate)
                elif has("predicate") then .predicate
                else empty
                end;
              any(.[]; predicate == $expected[0])
            ' "$output" >/dev/null || {
              echo "no verified $type attestation for $subject matches $predicate" >&2
              rm -f "$output"
              return 1
            }
            rm -f "$output"
          }

          subjects_file="$RUNNER_TEMP/release-subjects"
          jq -r '
            .components[]
            | .repository as $repository
            | ($repository + "@" + .index),
              (.platforms[] | $repository + "@" + .)
          ' dist/release/digests.json | sort -u > "$subjects_file"
          mapfile -t subjects < "$subjects_file"
          (( ${#subjects[@]} == 15 ))
          for subject in "${subjects[@]}"; do
            cosign verify \
              --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              "$subject" >/dev/null
            verify_attestation_predicate \
              slsaprovenance02 \
              "$subject" \
              dist/release/provenance.json
          done

          platform_subjects_file="$RUNNER_TEMP/release-platform-subjects"
          jq -r '
            .components
            | to_entries[]
            | .key as $component
            | .value.repository as $repository
            | .value.platforms
            | to_entries[]
            | [$component, .key, ($repository + "@" + .value)]
            | @tsv
          ' dist/release/digests.json > "$platform_subjects_file"
          platform_subject_count=0
          while IFS=$'\t' read -r component platform subject; do
            platform_subject_count=$((platform_subject_count + 1))
            slug="${component}-${platform//\//-}"
            verify_attestation_predicate \
              spdxjson \
              "$subject" \
              "dist/release/sbom-${slug}.spdx.json"
          done < "$platform_subjects_file"
          (( platform_subject_count == 10 ))

      - name: Stage assets, promote digests, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_release_tag() {
            local object object_type actual
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG") || return 1
            object_type=$(jq -er '.object.type' <<<"$object") || return 1
            actual=$(jq -er '.object.sha' <<<"$object") || return 1
            for _ in $(seq 1 8); do
              [[ "$object_type" == tag ]] || break
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual") || return 1
              object_type=$(jq -er '.object.type' <<<"$object") || return 1
              actual=$(jq -er '.object.sha' <<<"$object") || return 1
            done
            [[ "$object_type" == commit && "$actual" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$actual"
          }

          require_release_tag() {
            local actual
            actual=$(resolve_release_tag) || {
              echo "refs/tags/$RELEASE_TAG no longer resolves to a commit" >&2
              exit 1
            }
            [[ "$actual" == "$RELEASE_SHA" ]] || {
              echo "refs/tags/$RELEASE_TAG moved from $RELEASE_SHA to $actual" >&2
              exit 1
            }
          }

          require_release_commit() {
            local comparison
            require_release_tag
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq .status)
            if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
              echo "$RELEASE_TAG is no longer reachable from main (comparison: $comparison)" >&2
              exit 1
            fi
          }

          read_registry_digest() {
            local ref=$1 descriptor digest attempt error_file errors_file all_missing
            errors_file=$(mktemp "$RUNNER_TEMP/registry-inspect.XXXXXX")
            all_missing=true
            for attempt in $(seq 1 5); do
              error_file=$(mktemp "$RUNNER_TEMP/registry-inspect-attempt.XXXXXX")
              if descriptor=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$error_file"); then
                if digest=$(jq -er 'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor" 2>>"$errors_file"); then
                  rm -f "$error_file" "$errors_file"
                  printf '%s\n' "$digest"
                  return 0
                fi
                all_missing=false
                printf 'malformed manifest descriptor for %s:\n%s\n' "$ref" "$descriptor" >> "$errors_file"
              else
                {
                  printf 'attempt %s for %s:\n' "$attempt" "$ref"
                  cat "$error_file"
                } >> "$errors_file"
                if ! cmp -s "$error_file" <(printf 'ERROR: %s: not found\n' "$ref"); then
                  all_missing=false
                fi
              fi
              rm -f "$error_file"
              sleep $((attempt * 2))
            done

            if [[ "$all_missing" == true ]]; then
              rm -f "$errors_file"
              return 3
            fi
            cat "$errors_file" >&2
            rm -f "$errors_file"
            return 1
          }

          require_component_tag() {
            local component=$1 allow_missing=$2 repository digest existing status
            repository=$(jq -er --arg component "$component" '.components[$component].repository' dist/release/digests.json)
            digest=$(jq -er --arg component "$component" '.components[$component].index' dist/release/digests.json)
            if existing=$(read_registry_digest "$repository:$RELEASE_TAG"); then
              [[ "$existing" == "$digest" ]] || {
                echo "immutable release tag $repository:$RELEASE_TAG already points to $existing, not $digest" >&2
                exit 1
              }
              return 0
            else
              status=$?
            fi
            if (( status == 3 )) && [[ "$allow_missing" == true ]]; then
              return 0
            fi
            if (( status == 3 )); then
              echo "immutable release tag $repository:$RELEASE_TAG is missing" >&2
              exit 1
            fi
            echo "could not safely inspect immutable release tag $repository:$RELEASE_TAG" >&2
            exit "$status"
          }

          components=(runtime-base bottle-fetcher catalog-extractor materializer frontend)
          require_release_commit
          for component in "${components[@]}"; do
            require_component_tag "$component" true
          done

          assets_file="$RUNNER_TEMP/release-assets"
          find dist/release -maxdepth 1 -type f | sort > "$assets_file"
          mapfile -t assets < "$assets_file"
          (( ${#assets[@]} > 0 && ${#assets[@]} <= 200 ))
          total_asset_bytes=0
          for asset in "${assets[@]}"; do
            asset_name=${asset##*/}
            [[ "$asset_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$ ]]
            asset_bytes=$(wc -c < "$asset")
            (( asset_bytes >= 0 && asset_bytes <= MAX_RELEASE_ASSET_BYTES ))
            total_asset_bytes=$((total_asset_bytes + asset_bytes))
            (( total_asset_bytes <= MAX_RELEASE_TOTAL_BYTES ))
          done

          expected_prerelease=false
          release_args=(
            --draft
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG"
            --latest=false
          )
          if [[ "$STABLE" != true ]]; then
            expected_prerelease=true
            release_args+=(--prerelease)
          fi

          verify_draft_assets() {
            local release_json release_id uploaded_assets asset asset_name expected_digest uploaded_digest uploaded_size
            release_json=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,isDraft,isPrerelease,tagName)
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$expected_prerelease" '
                .tagName == $tag and
                .isDraft == true and
                .isPrerelease == $prerelease and
                (.databaseId | type == "number" and . > 0)
              ' <<<"$release_json" >/dev/null
            release_id=$(jq -er .databaseId <<<"$release_json")
            uploaded_assets=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")
            jq -e \
              --argjson expected_count "${#assets[@]}" \
              --argjson max_asset "$MAX_RELEASE_ASSET_BYTES" \
              --argjson max_total "$MAX_RELEASE_TOTAL_BYTES" '
                [.[][] | {name, digest, state, size}]
                | length == $expected_count
                and all(.[];
                  (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$"))
                  and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                  and .state == "uploaded"
                  and (.size | type == "number" and . >= 0 and . <= $max_asset))
                and ([.[].size] | add <= $max_total)
                and ([.[].name] | length == (unique | length))
              ' <<<"$uploaded_assets" >/dev/null

            for asset in "${assets[@]}"; do
              asset_name=${asset##*/}
              expected_digest=$(sha256sum "$asset")
              expected_digest="sha256:${expected_digest%% *}"
              uploaded_digest=$(jq -er --arg name "$asset_name" '
                [.[][] | select(.name == $name)]
                | if length == 1 then .[0].digest else error("missing or duplicate release asset") end
              ' <<<"$uploaded_assets")
              uploaded_size=$(jq -er --arg name "$asset_name" '
                [.[][] | select(.name == $name)]
                | if length == 1 then .[0].size else error("missing or duplicate release asset") end
              ' <<<"$uploaded_assets")
              [[ "$uploaded_digest" == "$expected_digest" ]]
              (( uploaded_size == $(wc -c < "$asset") ))
            done
          }

          case "$RELEASE_STATE" in
            absent)
              require_release_tag
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                "${release_args[@]}" \
                --repo "$GITHUB_REPOSITORY"
              ;;
            draft)
              ;;
            *)
              echo "unexpected target release state: $RELEASE_STATE" >&2
              exit 1
              ;;
          esac
          verify_draft_assets

          promote() {
            local component=$1 repository digest existing status published
            require_release_tag
            repository=$(jq -er --arg component "$component" '.components[$component].repository' dist/release/digests.json)
            digest=$(jq -er --arg component "$component" '.components[$component].index' dist/release/digests.json)

            if existing=$(read_registry_digest "$repository:$RELEASE_TAG"); then
              [[ "$existing" == "$digest" ]] || {
                echo "immutable release tag $repository:$RELEASE_TAG changed after preflight" >&2
                exit 1
              }
              return 0
            else
              status=$?
            fi
            if (( status != 3 )); then
              echo "could not safely re-inspect immutable release tag $repository:$RELEASE_TAG" >&2
              exit "$status"
            fi

            docker buildx imagetools create \
              --tag "$repository:$RELEASE_TAG" \
              "$repository@$digest"
            if ! published=$(read_registry_digest "$repository:$RELEASE_TAG"); then
              echo "could not verify promoted release tag $repository:$RELEASE_TAG" >&2
              exit 1
            fi
            [[ "$published" == "$digest" ]] || {
              echo "promoted release tag $repository:$RELEASE_TAG resolved to $published, not $digest" >&2
              exit 1
            }
          }

          require_release_commit
          for component in "${components[@]}"; do
            promote "$component"
          done

          verify_draft_assets
          for component in "${components[@]}"; do
            require_component_tag "$component" false
          done
          require_release_commit
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest=false \
            --repo "$GITHUB_REPOSITORY"

      - name: Release summary
        run: |
          {
            echo "### Released $RELEASE_TAG"
            echo
            jq -r '
              .components
              | to_entries[]
              | "- `" + .value.repository + "@" + .value.index + "`"
            ' dist/release/digests.json
            echo
            echo "The release assets include the signed component manifest, input tuple, digests, SBOMs, vulnerability reports, provenance predicate, and checksums."
          } >> "$GITHUB_STEP_SUMMARY"
