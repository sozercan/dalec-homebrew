name: release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional commit expected from the tag creation event
        required: false
        type: string
      tag:
        description: Existing v-prefixed OCI-compatible SemVer tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  BUILDX_VERSION: v0.36.0
  BUILDX_SHA256_AMD64: 07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99
  BUILDX_SHA256_ARM64: 70382de03915c07c488ae4ddc4f7e169ee978f953e754ecfce110ba017e0132b
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  SYFT_IMAGE: docker.io/anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
  MAX_RELEASE_ASSET_BYTES: 268435456
  MAX_RELEASE_TOTAL_BYTES: 1073741824
  MAX_RUNTIME_EVIDENCE_EXPANDED_BYTES: 268435456
  RELEASE_SPECS: live-test live-curl live-python-curl live-hf-curl live-python live-glibc live-redis live-graphviz live-toolchain
  RELEASE_AMD64_ONLY_SPECS: ci-noncore-multi-package

jobs:
  prepare:
    name: Validate release ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      stable: ${{ steps.request.outputs.stable }}
    steps:
      - name: Validate release request
        id: request
        env:
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha || github.event.client_payload.expected_sha }}
          INPUT_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "release requests must use the trusted main branch workflow" >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch|workflow_dispatch)
              ;;
            *)
              echo "unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          tag=$INPUT_TAG
          expected_sha=$INPUT_EXPECTED_SHA
          if [[ -n "$expected_sha" && ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release request has an invalid expected commit: $expected_sha" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tag is not supported semver: $tag" >&2
            exit 1
          fi

          if (( ${#tag} > 128 )); then
            echo "release tag exceeds the OCI tag limit: $tag" >&2
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            prerelease=${tag#*-}
            IFS=. read -r -a identifiers <<<"$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != 0 && "$identifier" == 0* ]]; then
                echo "numeric prerelease identifier has a leading zero: $identifier" >&2
                exit 1
              fi
            done
          fi

          stable=true
          [[ "$tag" == *-* ]] && stable=false
          {
            echo "tag=$tag"
            echo "expected_sha=$expected_sha"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and main reachability
        id: release
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "checked-out HEAD $head_sha does not match $RELEASE_TAG ($tag_sha)" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "$RELEASE_TAG moved from the pushed commit $EXPECTED_SHA to $tag_sha" >&2
            exit 1
          fi

          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag_sha...main" --jq .status)
          if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
            echo "$RELEASE_TAG is not reachable from origin/main (comparison: $comparison)" >&2
            exit 1
          fi

          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  release_target:
    name: Inspect target release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Draft visibility is required for safe no-rebuild recovery.
      contents: write
    outputs:
      state: ${{ steps.target.outputs.state }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Inspect target GitHub release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          repository=${GITHUB_REPOSITORY#*/}
          # GraphQL variables are intentionally literal in the single-quoted query.
          # shellcheck disable=SC2016
          release_json=$(gh api graphql \
            -F owner="$owner" \
            -F name="$repository" \
            -F tag="$RELEASE_TAG" \
            -f query='
              query TargetRelease($owner: String!, $name: String!, $tag: String!) {
                repository(owner: $owner, name: $name) {
                  release(tagName: $tag) {
                    databaseId
                    isDraft
                    isPrerelease
                    tagName
                  }
                }
              }')
          state=$(jq -er --arg tag "$RELEASE_TAG" '
            if (((.errors // []) | length) != 0) or
               ((.data.repository | type) != "object") then
              error("malformed target release response")
            else
              .data.repository.release as $release
              | if $release == null then
                  "absent"
                elif ($release.tagName != $tag or
                      ($release.databaseId | type) != "number" or
                      $release.databaseId <= 0 or
                      ($release.isDraft | type) != "boolean" or
                      ($release.isPrerelease | type) != "boolean") then
                  error("malformed target release response")
                elif $release.isDraft then
                  "draft"
                else
                  "published"
                end
            end
          ' <<<"$release_json")
          if [[ "$state" == published ]]; then
            echo "$RELEASE_TAG already has a published GitHub release; releases are not overwritten" >&2
            exit 1
          fi
          if [[ "$state" == draft ]]; then
            echo "$RELEASE_TAG has a draft release; this run will verify and resume its signed tuple"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Authorize new release source
        if: steps.target.outputs.state == 'absent'
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" == "$TRUSTED_WORKFLOW_SHA" ]] || {
            echo "new releases must tag the trusted workflow commit $TRUSTED_WORKFLOW_SHA, not $RELEASE_SHA" >&2
            exit 1
          }

  ci:
    name: Validate tagged source
    needs: [prepare, release_target]
    if: needs.release_target.outputs.state == 'absent'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Build immutable component tuple
    needs: [prepare, ci, release_target]
    if: needs.release_target.outputs.state == 'absent'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_TAG: build-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Install checksum-pinned Buildx
        run: &install-buildx |
          set -euo pipefail
          [[ "$BUILDX_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$(uname -m)" in
            x86_64|amd64)
              arch=amd64
              expected=$BUILDX_SHA256_AMD64
              ;;
            aarch64|arm64)
              arch=arm64
              expected=$BUILDX_SHA256_ARM64
              ;;
            *)
              echo "unsupported Buildx host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          asset="buildx-${BUILDX_VERSION}.linux-${arch}"
          binary="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-filesize 134217728 \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/${asset}" \
            --output "$binary"
          printf '%s  %s\n' "$expected" "$binary" | sha256sum -c -
          plugin_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          install -d -m 0755 "$plugin_dir"
          install -m 0755 "$binary" "$plugin_dir/docker-buildx"
          docker buildx version | grep -F " $BUILDX_VERSION "

      - name: Set up Docker Buildx
        run: &setup-buildx |
          set -euo pipefail
          builder="${GITHUB_JOB//_/-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use \
            --bootstrap

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture and validate release inputs
        run: |
          mkdir -p dist/release
          ./scripts/release-inputs.sh > dist/release/inputs.json
          jq . dist/release/inputs.json

      - name: Build children and assemble component indexes
        env:
          REGISTRY: ${{ env.REGISTRY_NAMESPACE }}
          VERSION: ${{ env.BUILD_TAG }}
        run: |
          set -euo pipefail

          runtime_base_repo="$REGISTRY/dalec-homebrew-runtime-base"
          bottle_fetcher_repo="$REGISTRY/dalec-homebrew-bottle-fetcher"
          catalog_extractor_repo="$REGISTRY/dalec-homebrew-catalog-extractor"
          materializer_repo="$REGISTRY/dalec-homebrew-materializer"
          frontend_repo="$REGISTRY/dalec-homebrew"

          inspect_digest() {
            local ref=$1 descriptor digest
            for attempt in $(seq 1 12); do
              if descriptor=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null) \
                && digest=$(jq -er 'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor"); then
                printf '%s\n' "$digest"
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "could not resolve registry digest for $ref" >&2
            return 1
          }


          build_target() {
            local target=$1 metadata
            metadata="$RUNNER_TEMP/build-${target}.json"
            REGISTRY="$REGISTRY" VERSION="$VERSION" docker buildx bake "$target" \
              --metadata-file "$metadata" \
              --push \
              --provenance=false \
              --sbom=false >&2
            jq -er --arg target "$target" '
              .[$target] as $result
              | $result["containerimage.digest"] as $digest
              | select($digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              | select($result["containerimage.descriptor"].digest == $digest)
              | $digest
            ' "$metadata"
          }

          target_tag() {
            local target=$1
            REGISTRY="$REGISTRY" VERSION="$VERSION" docker buildx bake --print "$target" \
              | jq -er --arg target "$target" '.target[$target].tags | if length == 1 then .[0] else error("expected exactly one tag") end'
          }

          create_index() {
            local repository=$1 tag=$2 amd64=$3 arm64=$4 metadata digest published
            metadata="$RUNNER_TEMP/index-${tag}.json"
            docker buildx imagetools create \
              --tag "$repository:$tag" \
              --metadata-file "$metadata" \
              "$repository@$amd64" \
              "$repository@$arm64" >&2
            digest=$(jq -er '
              .["containerimage.descriptor"].digest
              | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
            ' "$metadata")
            published=$(inspect_digest "$repository:$tag")
            [[ "$published" == "$digest" ]] || {
              echo "created index $repository:$tag resolved to $published, not exporter digest $digest" >&2
              return 1
            }
            printf '%s\n' "$digest"
          }

          platform_digest() {
            local ref=$1 platform=$2 os arch
            os=${platform%/*}
            arch=${platform#*/}
            docker buildx imagetools inspect --raw "$ref" \
              | jq -er --arg os "$os" --arg arch "$arch" '
                  .manifests as $manifests
                  | [$manifests[] | select(
                      (.platform.os // "") != "unknown" or
                      (.platform.architecture // "") != "unknown"
                    )] as $platform_manifests
                  | if (($platform_manifests | length) == 2 and
                        ([$platform_manifests[] | .platform.os + "/" + .platform.architecture] | sort) ==
                          ["linux/amd64", "linux/arm64"]) then
                      $platform_manifests
                    else
                      error("expected exactly the linux/amd64 and linux/arm64 platform children")
                    end
                  | [.[] | select(.platform.os == $os and .platform.architecture == $arch)]
                  | if length == 1 then .[0].digest else error("expected exactly one platform child") end
                  | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
                '
          }

          dalec_frontend_index=$(jq -er .dalec_frontend.index dist/release/inputs.json)
          for platform in linux/amd64 linux/arm64; do
            expected_ref=$(jq -er --arg platform "$platform" '.dalec_frontend.platforms[$platform]' dist/release/inputs.json)
            expected_digest=${expected_ref##*@}
            actual_digest=$(platform_digest "$dalec_frontend_index" "$platform")
            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "upstream Dalec frontend $platform child $actual_digest does not match release input $expected_digest" >&2
              exit 1
            }
          done

          for target in runtime-base-amd64 runtime-base-arm64; do
            digest=$(build_target "$target")
            tag=$(target_tag "$target")
            published=$(inspect_digest "$tag")
            [[ "$published" == "$digest" ]] || {
              echo "$target tag $tag resolved to $published, not exporter digest $digest" >&2
              exit 1
            }
            printf '%s=%s\n' "$target" "$digest"
            printf -v "${target//-/_}" '%s' "$digest"
          done

          runtime_base_index=$(create_index \
            "$runtime_base_repo" "$VERSION" \
            "$runtime_base_amd64" "$runtime_base_arm64")
          [[ $(platform_digest "$runtime_base_repo@$runtime_base_index" linux/amd64) == "$runtime_base_amd64" ]]
          [[ $(platform_digest "$runtime_base_repo@$runtime_base_index" linux/arm64) == "$runtime_base_arm64" ]]

          for target in \
            bottle-fetcher-amd64 bottle-fetcher-arm64 \
            catalog-extractor-amd64 catalog-extractor-arm64; do
            digest=$(build_target "$target")
            tag=$(target_tag "$target")
            published=$(inspect_digest "$tag")
            [[ "$published" == "$digest" ]] || {
              echo "$target tag $tag resolved to $published, not exporter digest $digest" >&2
              exit 1
            }
            printf '%s=%s\n' "$target" "$digest"
            printf -v "${target//-/_}" '%s' "$digest"
          done

          bottle_fetcher_index=$(create_index \
            "$bottle_fetcher_repo" "$VERSION" \
            "$bottle_fetcher_amd64" "$bottle_fetcher_arm64")
          catalog_extractor_index=$(create_index \
            "$catalog_extractor_repo" "$VERSION" \
            "$catalog_extractor_amd64" "$catalog_extractor_arm64")
          [[ $(platform_digest "$bottle_fetcher_repo@$bottle_fetcher_index" linux/amd64) == "$bottle_fetcher_amd64" ]]
          [[ $(platform_digest "$bottle_fetcher_repo@$bottle_fetcher_index" linux/arm64) == "$bottle_fetcher_arm64" ]]
          [[ $(platform_digest "$catalog_extractor_repo@$catalog_extractor_index" linux/amd64) == "$catalog_extractor_amd64" ]]
          [[ $(platform_digest "$catalog_extractor_repo@$catalog_extractor_index" linux/arm64) == "$catalog_extractor_arm64" ]]

          go run ./cmd/v2-bindings \
            --catalog-extractor-ref "$catalog_extractor_repo@$catalog_extractor_index" \
            --output "$RUNNER_TEMP/v2-bindings.json"
          export BOTTLE_FETCHER_REF="$bottle_fetcher_repo@$bottle_fetcher_index"
          export CATALOG_EXTRACTOR_REF
          export TAP_POLICY_DIGEST
          export EXECUTABLE_RUNTIME_POLICY_DIGEST
          export SUPPORTED_CATALOG_POLICY_VERSIONS
          export SUPPORTED_FETCH_POLICY_VERSIONS
          export SUPPORTED_PROVENANCE_POLICY_VERSIONS
          CATALOG_EXTRACTOR_REF=$(jq -er .catalog_extractor_ref "$RUNNER_TEMP/v2-bindings.json")
          TAP_POLICY_DIGEST=$(jq -er .tap_policy_digest "$RUNNER_TEMP/v2-bindings.json")
          EXECUTABLE_RUNTIME_POLICY_DIGEST=$(jq -er .executable_runtime_policy_digest "$RUNNER_TEMP/v2-bindings.json")
          SUPPORTED_CATALOG_POLICY_VERSIONS=$(jq -er .supported_catalog_policy_versions "$RUNNER_TEMP/v2-bindings.json")
          SUPPORTED_FETCH_POLICY_VERSIONS=$(jq -er .supported_fetch_policy_versions "$RUNNER_TEMP/v2-bindings.json")
          SUPPORTED_PROVENANCE_POLICY_VERSIONS=$(jq -er .supported_provenance_policy_versions "$RUNNER_TEMP/v2-bindings.json")

          for target in materializer-amd64 materializer-arm64; do
            digest=$(build_target "$target")
            tag=$(target_tag "$target")
            published=$(inspect_digest "$tag")
            [[ "$published" == "$digest" ]] || {
              echo "$target tag $tag resolved to $published, not exporter digest $digest" >&2
              exit 1
            }
            printf '%s=%s\n' "$target" "$digest"
            printf -v "${target//-/_}" '%s' "$digest"
          done

          for platform in linux/amd64 linux/arm64; do
            arch=${platform#*/}
            runtime_base_var="runtime_base_${arch}"
            materializer_var="materializer_${arch}"
            materializer_ref="$materializer_repo@${!materializer_var}"
            docker run --rm --platform "$platform" \
              --entrypoint /bin/bash \
              "$runtime_base_repo@${!runtime_base_var}" \
              -euc 'test "$(id -u):$(id -g)" = 1000:1000; test ! -e /usr/bin/apt; test -r /usr/share/dalec-homebrew/runtime-base-packages.tsv'
            docker run --rm --platform "$platform" \
              --entrypoint /bin/bash \
              "$materializer_ref" \
              -euc 'test -x /usr/local/bin/dalec-homebrew-materializer; test -x /home/linuxbrew/.linuxbrew/Homebrew/bin/brew; test -r /usr/share/dalec-homebrew/runtime-base-packages.tsv'
            ./scripts/materializer-compat.sh \
              --image "$materializer_ref" \
              --platform "$platform"
            ./scripts/materializer-compat.sh \
              --image "$materializer_ref" \
              --platform "$platform" \
              --current
          done

          materializer_index=$(create_index \
            "$materializer_repo" "$VERSION" \
            "$materializer_amd64" "$materializer_arm64")

          [[ $(platform_digest "$materializer_repo@$materializer_index" linux/amd64) == "$materializer_amd64" ]]
          [[ $(platform_digest "$materializer_repo@$materializer_index" linux/arm64) == "$materializer_arm64" ]]

          go run ./cmd/metadata-bundle \
            --output dist/release/metadata-bundle \
            --digest-output dist/release/metadata-bundle.digest
          METADATA_BUNDLE_DIGEST=$(<dist/release/metadata-bundle.digest)
          [[ "$METADATA_BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          actual_metadata_bundle_digest="sha256:$(sha256sum dist/release/metadata-bundle/manifest.json | awk '{print $1}')"
          [[ "$actual_metadata_bundle_digest" == "$METADATA_BUNDLE_DIGEST" ]] || {
            echo "metadata bundle digest does not match its canonical manifest" >&2
            exit 1
          }
          inputs_candidate=$(mktemp dist/release/inputs.json.XXXXXX)
          jq --arg digest "$METADATA_BUNDLE_DIGEST" \
            '.metadata_bundle_digest = $digest' \
            dist/release/inputs.json > "$inputs_candidate"
          mv "$inputs_candidate" dist/release/inputs.json
          export METADATA_BUNDLE_DIGEST

          export RUNTIME_BASE_REF_AMD64="$runtime_base_repo@$runtime_base_amd64"
          export RUNTIME_BASE_REF_ARM64="$runtime_base_repo@$runtime_base_arm64"
          export MATERIALIZER_REF_AMD64="$materializer_repo@$materializer_amd64"
          export MATERIALIZER_REF_ARM64="$materializer_repo@$materializer_arm64"
          export FRONTEND_REF=''
          for target in frontend-amd64 frontend-arm64; do
            digest=$(build_target "$target")
            tag=$(target_tag "$target")
            published=$(inspect_digest "$tag")
            [[ "$published" == "$digest" ]] || {
              echo "$target tag $tag resolved to $published, not exporter digest $digest" >&2
              exit 1
            }
            printf '%s=%s\n' "$target" "$digest"
            printf -v "${target//-/_}" '%s' "$digest"
          done

          frontend_index=$(create_index \
            "$frontend_repo" "$VERSION" \
            "$frontend_amd64" "$frontend_arm64")
          [[ $(platform_digest "$frontend_repo@$frontend_index" linux/amd64) == "$frontend_amd64" ]]
          [[ $(platform_digest "$frontend_repo@$frontend_index" linux/arm64) == "$frontend_arm64" ]]

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg git_sha "$RELEASE_SHA" \
            --slurpfile inputs dist/release/inputs.json \
            --arg build_invocation "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg frontend_repo "$frontend_repo" \
            --arg frontend_index "$frontend_index" \
            --arg frontend_amd64 "$frontend_amd64" \
            --arg frontend_arm64 "$frontend_arm64" \
            --arg runtime_base_repo "$runtime_base_repo" \
            --arg runtime_base_index "$runtime_base_index" \
            --arg runtime_base_amd64 "$runtime_base_amd64" \
            --arg runtime_base_arm64 "$runtime_base_arm64" \
            --arg bottle_fetcher_repo "$bottle_fetcher_repo" \
            --arg bottle_fetcher_index "$bottle_fetcher_index" \
            --arg bottle_fetcher_amd64 "$bottle_fetcher_amd64" \
            --arg bottle_fetcher_arm64 "$bottle_fetcher_arm64" \
            --arg catalog_extractor_repo "$catalog_extractor_repo" \
            --arg catalog_extractor_index "$catalog_extractor_index" \
            --arg catalog_extractor_amd64 "$catalog_extractor_amd64" \
            --arg catalog_extractor_arm64 "$catalog_extractor_arm64" \
            --arg materializer_repo "$materializer_repo" \
            --arg materializer_index "$materializer_index" \
            --arg materializer_amd64 "$materializer_amd64" \
            --arg materializer_arm64 "$materializer_arm64" \
            '{
              schema_version: "dalec-homebrew-release-digests/v2",
              source: {
                tag: $release_tag,
                git_sha: $git_sha,
                source_date_epoch: $inputs[0].source_date_epoch,
                build_invocation: $build_invocation
              },
              components: {
                frontend: {
                  repository: $frontend_repo,
                  index: $frontend_index,
                  platforms: {
                    "linux/amd64": $frontend_amd64,
                    "linux/arm64": $frontend_arm64
                  }
                },
                "runtime-base": {
                  repository: $runtime_base_repo,
                  index: $runtime_base_index,
                  platforms: {
                    "linux/amd64": $runtime_base_amd64,
                    "linux/arm64": $runtime_base_arm64
                  }
                },
                "bottle-fetcher": {
                  repository: $bottle_fetcher_repo,
                  index: $bottle_fetcher_index,
                  platforms: {
                    "linux/amd64": $bottle_fetcher_amd64,
                    "linux/arm64": $bottle_fetcher_arm64
                  }
                },
                "catalog-extractor": {
                  repository: $catalog_extractor_repo,
                  index: $catalog_extractor_index,
                  platforms: {
                    "linux/amd64": $catalog_extractor_amd64,
                    "linux/arm64": $catalog_extractor_arm64
                  }
                },
                materializer: {
                  repository: $materializer_repo,
                  index: $materializer_index,
                  platforms: {
                    "linux/amd64": $materializer_amd64,
                    "linux/arm64": $materializer_arm64
                  }
                }
              }
            }' > dist/release/digests.json

          jq . dist/release/digests.json

      - name: Generate and verify component manifest
        run: |
          set -euo pipefail
          ref() {
            local component=$1 kind=$2 platform=${3:-}
            if [[ "$kind" == index ]]; then
              jq -er --arg component "$component" '.components[$component].repository + "@" + .components[$component].index' dist/release/digests.json
            else
              jq -er --arg component "$component" --arg platform "$platform" '.components[$component].repository + "@" + .components[$component].platforms[$platform]' dist/release/digests.json
            fi
          }

          go run ./cmd/v2-bindings \
            --catalog-extractor-ref "$(ref catalog-extractor index)" \
            --output "$RUNNER_TEMP/v2-bindings.json"

          go run ./cmd/release-manifest \
            --schema-version v2 \
            --frontend-index "$(ref frontend index)" \
            --frontend-amd64 "$(ref frontend child linux/amd64)" \
            --frontend-arm64 "$(ref frontend child linux/arm64)" \
            --runtime-base-index "$(ref runtime-base index)" \
            --runtime-base-amd64 "$(ref runtime-base child linux/amd64)" \
            --runtime-base-arm64 "$(ref runtime-base child linux/arm64)" \
            --materializer-index "$(ref materializer index)" \
            --materializer-amd64 "$(ref materializer child linux/amd64)" \
            --materializer-arm64 "$(ref materializer child linux/arm64)" \
            --bottle-fetcher-index "$(ref bottle-fetcher index)" \
            --bottle-fetcher-amd64 "$(ref bottle-fetcher child linux/amd64)" \
            --bottle-fetcher-arm64 "$(ref bottle-fetcher child linux/arm64)" \
            --catalog-extractor-index "$(ref catalog-extractor index)" \
            --catalog-extractor-amd64 "$(ref catalog-extractor child linux/amd64)" \
            --catalog-extractor-arm64 "$(ref catalog-extractor child linux/arm64)" \
            --homebrew-commit "$(jq -er .homebrew_commit dist/release/inputs.json)" \
            --portable-ruby-version "$(jq -er .portable_ruby_version dist/release/inputs.json)" \
            --verification-keys-digest "$(jq -er .verification_keys_digest dist/release/inputs.json)" \
            --metadata-bundle-digest "$(jq -er .metadata_bundle_digest dist/release/inputs.json)" \
            --dalec-module "$(jq -er .dalec_module dist/release/inputs.json)" \
            --buildkit-module "$(jq -er .buildkit_module dist/release/inputs.json)" \
            --tap-policy-digest "$(jq -er .tap_policy_digest "$RUNNER_TEMP/v2-bindings.json")" \
            --executable-runtime-policy-digest "$(jq -er .executable_runtime_policy_digest "$RUNNER_TEMP/v2-bindings.json")" \
            --supported-catalog-policy-versions "$(jq -er .supported_catalog_policy_versions "$RUNNER_TEMP/v2-bindings.json")" \
            --supported-fetch-policy-versions "$(jq -er .supported_fetch_policy_versions "$RUNNER_TEMP/v2-bindings.json")" \
            --supported-provenance-policy-versions "$(jq -er .supported_provenance_policy_versions "$RUNNER_TEMP/v2-bindings.json")" \
            --output dist/release/components.json

          go run ./cmd/release-verify dist/release/components.json \
            | tee dist/release/components.digest

      - name: Upload immutable build tuple
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: dist/release
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  integration:
    name: Integration test (${{ matrix.platform }})
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download immutable build tuple
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: dist/release

      - name: Install checksum-pinned Buildx
        run: *install-buildx

      - name: Set up Docker Buildx
        run: *setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test a runtime from the released tuple
        env:
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          builder="${GITHUB_JOB//_/-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          component_ref() {
            local component=$1 platform=${2:-}
            jq -er --arg component "$component" --arg platform "$platform" '
              .components[$component].repository + "@" +
              (if $platform == "" then .components[$component].index else .components[$component].platforms[$platform] end)
            ' dist/release/digests.json
          }

          runtime_base_ref=$(component_ref runtime-base "$PLATFORM")
          materializer_ref=$(component_ref materializer "$PLATFORM")
          frontend_index_ref=$(component_ref frontend)
          frontend_ref=$(component_ref frontend "$PLATFORM")
          dalec_frontend_ref=$(jq -er --arg platform "$PLATFORM" '.dalec_frontend.platforms[$platform]' dist/release/inputs.json)
          dalec_frontend_route=$(jq -er .dalec_frontend.route dist/release/inputs.json)
          source_date_epoch=$(jq -er .source.source_date_epoch dist/release/digests.json)

          read -r -a specs <<< "$RELEASE_SPECS"
          (( ${#specs[@]} > 0 ))
          read -r -a amd64_only_specs <<< "$RELEASE_AMD64_ONLY_SPECS"
          (( ${#amd64_only_specs[@]} > 0 ))
          if [[ "$PLATFORM" == linux/amd64 ]]; then
            specs+=("${amd64_only_specs[@]}")
          fi
          mkdir -p runtime-evidence
          for spec in "${specs[@]}"; do
            final_image="dalec-homebrew-live:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PLATFORM_SLUG}-${spec}"
            DALEC_HOMEBREW_LIVE_BUILDER="$builder" \
            DALEC_HOMEBREW_LIVE_PLATFORM="$PLATFORM" \
            DALEC_HOMEBREW_LIVE_SPEC="examples/${spec}.yaml" \
            DALEC_HOMEBREW_LIVE_RUNTIME_BASE_REF="$runtime_base_ref" \
            DALEC_HOMEBREW_LIVE_MATERIALIZER_REF="$materializer_ref" \
            DALEC_HOMEBREW_LIVE_FRONTEND_INDEX_REF="$frontend_index_ref" \
            DALEC_HOMEBREW_LIVE_FRONTEND_REF="$frontend_ref" \
            DALEC_HOMEBREW_LIVE_DALEC_FRONTEND_REF="$dalec_frontend_ref" \
            DALEC_HOMEBREW_LIVE_TARGET="$dalec_frontend_route" \
            DALEC_HOMEBREW_LIVE_METADATA_BUNDLE="$PWD/dist/release/metadata-bundle" \
            DALEC_HOMEBREW_LIVE_SOURCE_DATE_EPOCH="$source_date_epoch" \
            DALEC_HOMEBREW_LIVE_IMAGE="$final_image" \
            DALEC_HOMEBREW_LIVE_OUTPUT=load \
            DALEC_HOMEBREW_LIVE_PROGRESS=plain \
              ./scripts/live-test.sh

            evidence_root="runtime-evidence/${spec}"
            mkdir -p "$evidence_root"
            container=$(docker create --platform "$PLATFORM" "$final_image")
            docker cp "$container:/usr/share/dalec-homebrew/." "$evidence_root/"
            docker rm -v "$container" >/dev/null
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=ustar \
              -C "$evidence_root" \
              -cf - . \
              | gzip -n > "runtime-evidence-${PLATFORM_SLUG}-${spec}.tar.gz"
          done

      - name: Upload runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-${{ matrix.slug }}
          path: runtime-evidence-${{ matrix.slug }}-*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  evidence:
    name: Evidence (${{ matrix.component }}, ${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            platform: linux/amd64
            slug: frontend-linux-amd64
          - component: frontend
            platform: linux/arm64
            slug: frontend-linux-arm64
          - component: runtime-base
            platform: linux/amd64
            slug: runtime-base-linux-amd64
          - component: runtime-base
            platform: linux/arm64
            slug: runtime-base-linux-arm64
          - component: bottle-fetcher
            platform: linux/amd64
            slug: bottle-fetcher-linux-amd64
          - component: bottle-fetcher
            platform: linux/arm64
            slug: bottle-fetcher-linux-arm64
          - component: catalog-extractor
            platform: linux/amd64
            slug: catalog-extractor-linux-amd64
          - component: catalog-extractor
            platform: linux/arm64
            slug: catalog-extractor-linux-arm64
          - component: materializer
            platform: linux/amd64
            slug: materializer-linux-amd64
          - component: materializer
            platform: linux/arm64
            slug: materializer-linux-arm64
    steps:
      - name: Download immutable build tuple
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: dist/release

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable subject
        id: subject
        env:
          COMPONENT: ${{ matrix.component }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          repository=$(jq -er --arg component "$COMPONENT" '.components[$component].repository' dist/release/digests.json)
          digest=$(jq -er --arg component "$COMPONENT" --arg platform "$PLATFORM" '.components[$component].platforms[$platform]' dist/release/digests.json)
          echo "ref=$repository@$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        env:
          SUBJECT: ${{ steps.subject.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker_config=${DOCKER_CONFIG:-$HOME/.docker}
          test -f "$docker_config/config.json"
          docker run --rm \
            --volume "$docker_config:/root/.docker:ro" \
            --volume "$PWD/evidence:/evidence" \
            "$SYFT_IMAGE" scan --platform "$PLATFORM" "$SUBJECT" \
            -o "spdx-json=/evidence/sbom-${SLUG}.spdx.json"

      - name: Generate fixed critical vulnerability report
        env:
          SUBJECT: ${{ steps.subject.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          docker_config=${DOCKER_CONFIG:-$HOME/.docker}
          test -f "$docker_config/config.json"
          docker run --rm \
            --volume "$docker_config:/root/.docker:ro" \
            --volume "$PWD/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --platform "$PLATFORM" \
            --scanners vuln \
            --format json \
            --output "/evidence/vulnerability-${SLUG}.json" \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --no-progress \
            --skip-version-check \
            "$SUBJECT"

      - name: Summarize fixed critical vulnerability findings
        env:
          COMPONENT: ${{ matrix.component }}
          SUBJECT: ${{ steps.subject.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          report="evidence/vulnerability-${SLUG}.json"
          test -s "$report"
          report_size=$(wc -c < "$report")
          if (( report_size > MAX_RELEASE_ASSET_BYTES )); then
            echo "$report exceeds the release asset size limit" >&2
            exit 1
          fi

          findings=$(mktemp "$RUNNER_TEMP/vulnerability-findings.XXXXXX")
          trap 'rm -f "$findings"' EXIT
          jq -c -e --arg subject "$SUBJECT" '
            if type != "object" or .SchemaVersion != 2 then
              error("unexpected Trivy schema")
            elif .ArtifactName != $subject then
              error("Trivy ArtifactName does not match the expected subject")
            elif .ArtifactType != "container_image" then
              error("Trivy ArtifactType is not container_image")
            elif (.Metadata | type) != "object" then
              error("Trivy Metadata is not an object")
            elif (.Metadata.RepoDigests | type) != "array" or
                ((.Metadata.RepoDigests | index($subject)) == null) then
              error("Trivy RepoDigests does not contain the expected subject")
            elif (.Results | type) != "array" or (.Results | length) == 0 then
              error("Trivy Results is not a nonempty array")
            else
              [
                .Results[] as $result
                | if ($result | type) != "object" then
                    error("Trivy result is not an object")
                  elif ($result.Target | type) != "string" or
                      ($result.Target | length) == 0 then
                    error("Trivy result Target is missing")
                  elif $result.Vulnerabilities == null then
                    empty
                  elif ($result.Vulnerabilities | type) != "array" then
                    error("Trivy Vulnerabilities is not an array")
                  else
                    $result.Vulnerabilities[] as $vulnerability
                    | if ($vulnerability | type) != "object" then
                        error("Trivy vulnerability is not an object")
                      else
                        {
                          target: $result.Target,
                          id: (($vulnerability.VulnerabilityID // "unknown") | tostring),
                          package: (($vulnerability.PkgName // "unknown") | tostring),
                          installed: (($vulnerability.InstalledVersion // "unknown") | tostring),
                          fixed: (($vulnerability.FixedVersion // "unknown") | tostring),
                          severity: (($vulnerability.Severity // "UNKNOWN") | tostring)
                        }
                      end
                  end
              ]
              | sort_by([.id, .package, .installed, .fixed, .severity, .target])
            end
          ' "$report" > "$findings"

          finding_count=$(jq -er 'length' "$findings")
          summary_limit=50
          summary_field_limit=256
          {
            printf "### Component vulnerability scan: \`%s\` (\`%s\`)\n\n" "$COMPONENT" "$PLATFORM"
            printf -- "- Subject: \`%s\`\n" "$SUBJECT"
            printf -- "- Report: \`vulnerability-%s.json\`\n" "$SLUG"
            printf -- '- Fixed critical findings: **%s**\n\n' "$finding_count"
            if (( finding_count == 0 )); then
              echo "No fixed critical vulnerabilities were reported."
            else
              echo "| Vulnerability | Package | Installed | Fixed | Severity | Target |"
              echo "| --- | --- | --- | --- | --- | --- |"
              jq -r --argjson limit "$summary_limit" --argjson field_limit "$summary_field_limit" '
                def markdown:
                  tostring
                  | if length > $field_limit then .[:$field_limit] + "…" else . end
                  | explode
                  | map(
                      if . < 32 or (. >= 127 and . <= 159) or
                          (. >= 8234 and . <= 8238) or
                          (. >= 8294 and . <= 8297) then
                        32
                      else
                        .
                      end
                    )
                  | map("&#" + tostring + ";")
                  | join("");
                .[:$limit][]
                | "| \(.id | markdown) | \(.package | markdown) | \(.installed | markdown) | \(.fixed | markdown) | \(.severity | markdown) | \(.target | markdown) |"
              ' "$findings"
              if (( finding_count > summary_limit )); then
                echo
                printf '_Showing the first %s of %s findings in deterministic order; the JSON report contains the complete result._\n' \
                  "$summary_limit" "$finding_count"
              fi
              printf '_Summary fields are limited to %s characters; the JSON report contains the complete values._\n' \
                "$summary_field_limit"
            fi
            echo
            echo "_Vulnerability findings are release evidence and do not block signing or promotion._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.slug }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  sign:
    name: Sign and attest immutable tuple
    needs: [prepare, release_target, build, integration, evidence]
    if: needs.release_target.outputs.state == 'absent'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out trusted verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install checksum-pinned Buildx
        run: *install-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Download immutable build tuple
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: dist/release

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: dist/release/evidence
          merge-multiple: true

      - name: Download runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-evidence-*
          path: dist/release/runtime-evidence
          merge-multiple: true

      - name: Validate runtime evidence and metadata snapshot
        run: &validate-runtime-evidence |
          set -euo pipefail
          read -r -a specs <<< "$RELEASE_SPECS"
          (( ${#specs[@]} > 0 ))
          read -r -a amd64_only_specs <<< "$RELEASE_AMD64_ONLY_SPECS"
          (( ${#amd64_only_specs[@]} > 0 ))
          runtime_evidence_dir=dist/release
          [[ -d dist/release/runtime-evidence ]] && runtime_evidence_dir=dist/release/runtime-evidence

          extract_evidence_json() {
            python3 - "$1" "$2" "$3" <<'PYARCHIVE'
          import json
          import os
          from pathlib import Path
          import posixpath
          import resource
          import sys
          import tempfile
          import unicodedata
          import zlib

          max_archive_bytes = int(os.environ["MAX_RELEASE_ASSET_BYTES"])
          max_expanded_bytes = int(os.environ["MAX_RUNTIME_EVIDENCE_EXPANDED_BYTES"])
          max_members = 100_000
          max_document_bytes = 16 << 20
          if len(sys.argv) not in {3, 4}:
              raise SystemExit("runtime evidence extraction requires archive, output, and optional member arguments")
          archive_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          member_name = sys.argv[3] if len(sys.argv) == 4 else "resolution.json"
          if member_name not in {"resolution.json", "materialization-v2.json"}:
              raise SystemExit(f"unsupported runtime evidence member {member_name!r}")
          expected_path = "./" + member_name
          if sys.platform == "linux":
              memory_limit = 512 << 20
              resource.setrlimit(resource.RLIMIT_AS, (memory_limit, memory_limit))

          def read_exact(source, size):
              chunks = []
              remaining = size
              while remaining:
                  chunk = source.read(remaining)
                  if not chunk:
                      raise ValueError("archive is truncated")
                  chunks.append(chunk)
                  remaining -= len(chunk)
              return b"".join(chunks)

          def read_block(source):
              first = source.read(512)
              if not first:
                  return None
              if len(first) == 512:
                  return first
              return first + read_exact(source, 512 - len(first))

          def skip_exact(source, size):
              remaining = size
              while remaining:
                  chunk = source.read(min(1 << 20, remaining))
                  if not chunk:
                      raise ValueError("archive is truncated")
                  remaining -= len(chunk)

          def parse_octal(field, label):
              if field and field[0] & 0x80:
                  raise ValueError(f"archive {label} uses an unsupported base-256 value")
              value = field.strip(b" \0")
              if not value:
                  return 0
              if any(byte < ord("0") or byte > ord("7") for byte in value):
                  raise ValueError(f"archive {label} is not octal")
              return int(value, 8)

          def decode_field(field, label):
              value, separator, padding = field.partition(b"\0")
              if separator and any(byte not in (0, 32) for byte in padding):
                  raise ValueError(f"archive {label} has nonzero bytes after NUL")
              try:
                  return value.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise ValueError(f"archive {label} is not UTF-8") from exc

          def validate_header(block):
              stored_checksum = parse_octal(block[148:156], "checksum")
              checksum_block = bytearray(block)
              checksum_block[148:156] = b" " * 8
              if sum(checksum_block) != stored_checksum:
                  raise ValueError("archive header checksum is invalid")
              if block[257:263] != b"ustar\0" or block[263:265] != b"00":
                  raise ValueError("archive member is not POSIX USTAR")
              if any(block[500:512]):
                  raise ValueError("archive USTAR reserved header padding is nonzero")
              name = decode_field(block[0:100], "name")
              prefix = decode_field(block[345:500], "prefix")
              path = f"{prefix}/{name}" if prefix else name
              size = parse_octal(block[124:136], "size")
              typeflag = block[156:157]
              linkname = decode_field(block[157:257], "linkname")
              return path, size, typeflag, linkname

          def validate_member(path, size, typeflag, linkname):
              if len(path) > 4096 or not path:
                  raise ValueError("archive member path length is invalid")
              if any(unicodedata.category(char) in {"Cc", "Cf", "Cs"} for char in path) or "\\" in path:
                  raise ValueError("archive member name contains unsafe characters")
              if posixpath.isabs(path):
                  raise ValueError(f"archive contains absolute member path {path!r}")
              normalized = posixpath.normpath(path)
              if normalized == ".." or normalized.startswith("../"):
                  raise ValueError(f"archive member escapes the root: {path!r}")
              canonical = "." if normalized == "." else "./" + normalized
              is_directory = typeflag == b"5"
              is_regular = typeflag in {b"0", b"\0"}
              if not (is_directory or is_regular):
                  raise ValueError(f"archive member has unsafe type {typeflag!r}")
              if is_directory:
                  allowed_paths = {canonical, "./"} if canonical == "." else {canonical, canonical + "/"}
                  if path not in allowed_paths:
                      raise ValueError(f"archive uses noncanonical member path {path!r}")
              elif path != canonical:
                  raise ValueError(f"archive uses noncanonical member path {path!r}")
              if is_regular and canonical == ".":
                  raise ValueError("archive root must be a directory")
              if is_directory and size != 0:
                  raise ValueError("archive directory has a nonzero size")
              if linkname:
                  raise ValueError("archive member has an unexpected link target")
              return normalized, is_regular

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON member {key!r}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant {value}")

          try:
              archive_size = archive_path.stat().st_size
              if archive_size <= 0 or archive_size > max_archive_bytes:
                  raise ValueError(f"archive size {archive_size} is outside the allowed range")
              document_data = None
              member_count = 0
              total_size = 0
              with tempfile.TemporaryFile() as uncompressed:
                  decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  expanded_size = 0
                  with archive_path.open("rb") as compressed:
                      while True:
                          chunk = compressed.read(1 << 20)
                          if not chunk:
                              break
                          while chunk:
                              remaining = max_expanded_bytes - expanded_size
                              data = decompressor.decompress(chunk, min(1 << 20, remaining + 1))
                              if data:
                                  uncompressed.write(data)
                                  expanded_size += len(data)
                                  if expanded_size > max_expanded_bytes:
                                      raise ValueError("archive expansion exceeds the limit")
                              if decompressor.unused_data:
                                  raise ValueError("archive contains trailing or concatenated gzip data")
                              chunk = decompressor.unconsumed_tail
                              if decompressor.eof:
                                  if chunk or compressed.read(1):
                                      raise ValueError("archive contains trailing or concatenated gzip data")
                                  break
                          if decompressor.eof:
                              break
                  if not decompressor.eof:
                      raise ValueError("archive gzip stream is truncated")
                  flushed = decompressor.flush()
                  if flushed:
                      uncompressed.write(flushed)
                      expanded_size += len(flushed)
                      if expanded_size > max_expanded_bytes:
                          raise ValueError("archive expansion exceeds the limit")
                  uncompressed.seek(0)
                  zero_blocks = 0
                  while True:
                      block = read_block(uncompressed)
                      if block is None:
                          if zero_blocks < 2:
                              raise ValueError("archive is missing the canonical two-block end marker")
                          break
                      if block == bytes(512):
                          zero_blocks += 1
                          continue
                      if zero_blocks:
                          raise ValueError("archive contains nonzero data after the tar end marker")
                      member_count += 1
                      if member_count > max_members:
                          raise ValueError("archive contains too many members")
                      path, size, typeflag, linkname = validate_header(block)
                      normalized, is_regular = validate_member(path, size, typeflag, linkname)
                      total_size += size
                      if total_size > max_expanded_bytes:
                          raise ValueError("archive expansion exceeds the limit")
                      if normalized == member_name:
                          if path != expected_path or not is_regular:
                              raise ValueError(f"archive uses noncanonical {member_name} path {path!r}")
                          if document_data is not None:
                              raise ValueError(f"archive contains duplicate {expected_path} members")
                          if size <= 0 or size > max_document_bytes:
                              raise ValueError(f"archive {member_name} is not a bounded regular file")
                          document_data = read_exact(uncompressed, size)
                      else:
                          skip_exact(uncompressed, size)
                      padding = (-size) % 512
                      if padding and any(read_exact(uncompressed, padding)):
                          raise ValueError("archive member padding is nonzero")
              if document_data is None:
                  raise ValueError(f"archive is missing {expected_path}")
              json.loads(
                  document_data.decode("utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )
              output_path.write_bytes(document_data)
          except (EOFError, MemoryError, OSError, UnicodeError, ValueError, zlib.error) as exc:
              raise SystemExit(f"{archive_path}: invalid runtime evidence: {exc}")
          PYARCHIVE
          }

          # jq variables are intentionally literal in the single-quoted filter.
          # shellcheck disable=SC2016
          resolution_binding_filter='
            .schema_version == "dalec-homebrew-resolution/v2" and
            .input.platform.os == ($platform | split("/")[0]) and
            .input.platform.architecture == ($platform | split("/")[1]) and
            (((.input.platform | keys) == ["architecture", "os"]) or
             (((.input.platform | keys) == ["architecture", "os", "variant"]) and
              ((.input.platform.variant | type) == "string") and
              .input.platform.variant == "")) and
            .policy_version == $manifest[0].policy_version and
            .components.frontend_index_ref == $frontend_index and
            .components.frontend_ref == $frontend and
            .components.runtime_base_ref == $runtime_base and
            .components.materializer_ref == $materializer and
            .components.bottle_fetcher_ref == $bottle_fetcher and
            .components.catalog_extractor_ref == $catalog_extractor and
            .components.catalog_service_origin == "" and
            .components.ingestion_jws_key_policy_digest == "" and
            .components.tap_policy_digest == $manifest[0].tap_policy_digest and
            .components.executable_runtime_policy_digest == $manifest[0].executable_runtime_policy_digest and
            .components.homebrew_commit == $inputs[0].homebrew_commit and
            .components.ruby_runtime == $inputs[0].portable_ruby_version and
            .components.verification_keys_digest == $inputs[0].verification_keys_digest and
            .components.dalec_module == $inputs[0].dalec_module and
            .components.buildkit_module == $inputs[0].buildkit_module and
            .components.supported_catalog_policy_versions == $manifest[0].supported_catalog_policy_versions and
            .components.supported_fetch_policy_versions == $manifest[0].supported_fetch_policy_versions and
            .components.supported_provenance_policy_versions == $manifest[0].supported_provenance_policy_versions
          '

          evidence_inventory=()
          for spec in "${specs[@]}"; do
            for platform in linux/amd64 linux/arm64; do
              evidence_inventory+=("$spec" "$platform" common)
            done
          done
          for spec in "${amd64_only_specs[@]}"; do
            evidence_inventory+=("$spec" linux/amd64 amd64-only)
          done

          metadata_args=()
          for ((i = 0; i < ${#evidence_inventory[@]}; i += 3)); do
              spec=${evidence_inventory[i]}
              platform=${evidence_inventory[i + 1]}
              scope=${evidence_inventory[i + 2]}
              platform_slug=${platform//\//-}
              archive="$runtime_evidence_dir/runtime-evidence-${platform_slug}-${spec}.tar.gz"
              if [[ ! -s "$archive" ]]; then
                echo "missing or empty runtime evidence archive: $archive" >&2
                exit 1
              fi
              frontend_index_ref=$(jq -er '.components.frontend.repository + "@" + .components.frontend.index' dist/release/digests.json)
              frontend_ref=$(jq -er --arg platform "$platform" '.components.frontend.repository + "@" + .components.frontend.platforms[$platform]' dist/release/digests.json)
              runtime_base_ref=$(jq -er --arg platform "$platform" '.components["runtime-base"].repository + "@" + .components["runtime-base"].platforms[$platform]' dist/release/digests.json)
              materializer_ref=$(jq -er --arg platform "$platform" '.components.materializer.repository + "@" + .components.materializer.platforms[$platform]' dist/release/digests.json)
              bottle_fetcher_ref=$(jq -er '.components["bottle-fetcher"].repository + "@" + .components["bottle-fetcher"].index' dist/release/digests.json)
              catalog_extractor_ref=$(jq -er '.components["catalog-extractor"].repository + "@" + .components["catalog-extractor"].index' dist/release/digests.json)
              resolution="$RUNNER_TEMP/${spec}-${platform_slug}-resolution.json"
              extract_evidence_json "$archive" "$resolution" resolution.json
              if ! jq -e \
                --arg platform "$platform" \
                --arg frontend_index "$frontend_index_ref" \
                --arg frontend "$frontend_ref" \
                --arg runtime_base "$runtime_base_ref" \
                --arg materializer "$materializer_ref" \
                --arg bottle_fetcher "$bottle_fetcher_ref" \
                --arg catalog_extractor "$catalog_extractor_ref" \
                --slurpfile manifest dist/release/components.json \
                --slurpfile inputs dist/release/inputs.json \
                "$resolution_binding_filter" "$resolution" >/dev/null; then
                echo "runtime evidence binding mismatch for $spec on $platform: expected the complete V2 platform tuple" >&2
                exit 1
              fi
              if [[ "$scope" == amd64-only ]]; then
                if ! jq -e --arg catalog_extractor "$catalog_extractor_ref" '
                  .schema_version == "dalec-homebrew-resolution/v2" and
                  ([.metadata_sources[] | select(
                    .tap == "svt/avtools" and
                    .catalog_policy_version == "tap-catalog-v1" and
                    .extraction.policy_version == "build-local-tap-extraction-v1" and
                    .extraction.extractor_ref == $catalog_extractor
                  )] | length) == 1 and
                  ([.nodes[] | select(
                    .id == "svt/avtools/libdf" and
                    .bottle.transport.oci == null and
                    .bottle.transport.https.fetch_policy_version == "homebrew-bottle-fetch-v1"
                  )] | length) == 1
                ' "$resolution" >/dev/null; then
                  echo "runtime evidence for $spec on $platform does not prove published catalog extractor execution" >&2
                  exit 1
                fi
                materialization="$RUNNER_TEMP/${spec}-${platform_slug}-materialization-v2.json"
                extract_evidence_json "$archive" "$materialization" materialization-v2.json
                if ! jq -e '
                  .schema_version == "dalec-homebrew-materialization/v2" and
                  .preparation.schema_version == "dalec-homebrew-preparation/v2" and
                  ([.preparation.fetch_evidence[] | select(
                    .artifact_id == "svt/avtools/libdf" and
                    .schema_version == "bottle-fetch-evidence/v1" and
                    .fetch_policy_version == "homebrew-bottle-fetch-v1"
                  )] | length) == 1
                ' "$materialization" >/dev/null; then
                  echo "runtime evidence for $spec on $platform does not prove published bottle fetcher execution" >&2
                  exit 1
                fi
              fi
              metadata_args+=("$spec" "$platform" "$resolution")
          done

          candidate="$RUNNER_TEMP/metadata-snapshot-candidate.json"
          python3 - "$candidate" "$RELEASE_TAG" "$RELEASE_SHA" dist/release/inputs.json "${metadata_args[@]}" <<'PYMETADATA'
          from datetime import datetime
          import json
          from pathlib import Path
          import re
          import sys

          output_path = Path(sys.argv[1])
          release_tag = sys.argv[2]
          release_sha = sys.argv[3]
          inputs_path = Path(sys.argv[4])
          arguments = sys.argv[5:]
          if not arguments or len(arguments) % 3:
              raise SystemExit("metadata reconciliation requires spec/platform/resolution triples")

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          time_pattern = re.compile(
              r"([0-9]{4})-([0-9]{2})-([0-9]{2})T"
              r"([0-9]{2}):([0-9]{2}):([0-9]{2})"
              r"(?:\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})"
          )

          def exact_keys(value, expected, label):
              if not isinstance(value, dict) or set(value) != set(expected):
                  raise ValueError(f"{label} has unexpected fields")

          def timestamp(value, label):
              if not isinstance(value, str) or time_pattern.fullmatch(value) is None:
                  raise ValueError(f"{label} is not RFC3339")
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError as exc:
                  raise ValueError(f"{label} is invalid: {exc}") from exc
              if parsed.tzinfo is None:
                  raise ValueError(f"{label} has no timezone")
              return parsed

          def require_digest(value, label):
              if not isinstance(value, str) or digest_pattern.fullmatch(value) is None:
                  raise ValueError(f"{label} is not a sha256 digest")

          try:
              with inputs_path.open(encoding="utf-8") as source:
                  release_inputs = json.load(source)
              pinned_homebrew_commit = release_inputs["homebrew_commit"]
              if not isinstance(pinned_homebrew_commit, str) or re.fullmatch(r"[0-9a-f]{40}", pinned_homebrew_commit) is None:
                  raise ValueError("release input Homebrew commit is invalid")
          except (KeyError, OSError, TypeError, ValueError) as exc:
              raise SystemExit(f"{inputs_path}: invalid release inputs: {exc}")

          observations = []
          reference_identity = None
          seen = set()
          for index in range(0, len(arguments), 3):
              spec, platform, raw_path = arguments[index:index + 3]
              key = (spec, platform)
              if key in seen:
                  raise SystemExit(f"duplicate metadata observation for {spec} on {platform}")
              seen.add(key)
              try:
                  with Path(raw_path).open(encoding="utf-8") as source:
                      record = json.load(source)
                  if record.get("schema_version") != "dalec-homebrew-resolution/v2":
                      raise ValueError("unexpected resolution schema")
                  sources = record.get("metadata_sources")
                  if not isinstance(sources, list) or not sources:
                      raise ValueError("metadata_sources is not a nonempty array")
                  core_sources = [item for item in sources if isinstance(item, dict) and item.get("tap") == "homebrew/core"]
                  if len(core_sources) != 1:
                      raise ValueError("resolution must contain exactly one homebrew/core metadata source")
                  core = core_sources[0]
                  exact_keys(
                      core,
                      ("tap", "commit", "signer", "documents", "generated_at", "generated_at_source", "fetched_at", "sequence", "rollback"),
                      "homebrew/core metadata source",
                  )
                  if not isinstance(core["commit"], str) or re.fullmatch(r"[0-9a-f]{40}", core["commit"]) is None:
                      raise ValueError("homebrew/core commit is invalid")
                  if core["commit"] != pinned_homebrew_commit:
                      raise ValueError("homebrew/core commit does not match release input")
                  exact_keys(core["signer"], ("key_id", "algorithm", "verified"), "homebrew/core signer")
                  if not core["signer"]["key_id"] or core["signer"]["algorithm"] != "PS512" or core["signer"]["verified"] is not True:
                      raise ValueError("homebrew/core signer is invalid")
                  documents = core["documents"]
                  if not isinstance(documents, list) or len(documents) != 2:
                      raise ValueError("homebrew/core documents must contain exactly formula and migrations")
                  by_name = {}
                  for document in documents:
                      exact_keys(document, ("name", "digest", "envelope_digest"), "homebrew/core document")
                      name = document["name"]
                      if name in by_name:
                          raise ValueError(f"duplicate homebrew/core document {name!r}")
                      require_digest(document["digest"], f"{name} digest")
                      require_digest(document["envelope_digest"], f"{name} envelope digest")
                      by_name[name] = document
                  if set(by_name) != {"formula", "migrations"}:
                      raise ValueError("homebrew/core documents must contain exactly formula and migrations")
                  exact_keys(core["rollback"], ("policy", "sequence_floor", "state_digest"), "homebrew/core rollback")
                  if core["rollback"]["policy"] != "homebrew-core-generated-at-v1":
                      raise ValueError("homebrew/core rollback policy is invalid")
                  if isinstance(core["rollback"]["sequence_floor"], bool) or not isinstance(core["rollback"]["sequence_floor"], int) or core["rollback"]["sequence_floor"] < 0:
                      raise ValueError("homebrew/core rollback floor is invalid")
                  require_digest(core["rollback"]["state_digest"], "homebrew/core state digest")
                  if core["generated_at_source"] not in {"signed-payload", "http-last-modified"}:
                      raise ValueError("homebrew/core generated_at_source is invalid")
                  generated = timestamp(core["generated_at"], "homebrew/core generated_at")
                  fetched = timestamp(core["fetched_at"], "homebrew/core fetched_at")
                  if fetched < generated:
                      raise ValueError("homebrew/core fetched_at precedes generated_at")
                  core_epoch = int(generated.timestamp())
                  if isinstance(core["sequence"], bool) or core["sequence"] != core_epoch:
                      raise ValueError("homebrew/core sequence does not match generated_at")

                  source_epochs = []
                  for source_index, metadata_source in enumerate(sources):
                      if not isinstance(metadata_source, dict):
                          raise ValueError(f"metadata_sources[{source_index}] is not an object")
                      source_generated = timestamp(metadata_source.get("generated_at"), f"metadata_sources[{source_index}].generated_at")
                      source_fetched = timestamp(metadata_source.get("fetched_at"), f"metadata_sources[{source_index}].fetched_at")
                      if source_fetched < source_generated:
                          raise ValueError(f"metadata_sources[{source_index}].fetched_at precedes generated_at")
                      source_epochs.append(int(source_generated.timestamp()))
                  resolution_epoch = record.get("source_date_epoch")
                  if isinstance(resolution_epoch, bool) or not isinstance(resolution_epoch, int) or resolution_epoch != min(source_epochs):
                      raise ValueError("resolution source_date_epoch does not match the earliest metadata source")

                  identity = {
                      "digest": core["rollback"]["state_digest"],
                      "homebrew_commit": core["commit"],
                      "signer": core["signer"],
                      "formula_digest": by_name["formula"]["digest"],
                      "migration_digest": by_name["migrations"]["digest"],
                      "generated_at_source": core["generated_at_source"],
                      "rollback_policy": core["rollback"]["policy"],
                      "rollback_sequence_floor": core["rollback"]["sequence_floor"],
                  }
                  if reference_identity is None:
                      reference_identity = identity
                  elif identity != reference_identity:
                      raise ValueError("authenticated homebrew/core metadata identity differs across release integrations")
                  observations.append({
                      "spec": spec,
                      "platform": platform,
                      "generated_at": core["generated_at"],
                      "core_generated_at_epoch": core_epoch,
                      "formula_envelope_digest": by_name["formula"]["envelope_digest"],
                      "migration_envelope_digest": by_name["migrations"]["envelope_digest"],
                      "resolution_source_date_epoch": resolution_epoch,
                  })
              except (KeyError, OSError, TypeError, ValueError) as exc:
                  raise SystemExit(f"{raw_path}: invalid release metadata evidence: {exc}")

          generated_values = {item["generated_at"] for item in observations}
          if len(generated_values) != 1 and reference_identity["generated_at_source"] != "http-last-modified":
              raise SystemExit("signed homebrew/core generated_at differs across release integrations")
          accepted = min(observations, key=lambda item: (item["core_generated_at_epoch"], item["generated_at"]))
          snapshot = dict(reference_identity)
          snapshot["formula_envelope_digest"] = accepted["formula_envelope_digest"]
          snapshot["generated_at"] = accepted["generated_at"]
          snapshot["migration_envelope_digest"] = accepted["migration_envelope_digest"]
          snapshot["source_date_epoch"] = accepted["core_generated_at_epoch"]
          document = {
              "schema_version": "dalec-homebrew-release-metadata/v2",
              "release": {"tag": release_tag, "sha": release_sha},
              "accepted_snapshot": snapshot,
              "observations": observations,
          }
          output_path.write_text(json.dumps(document, ensure_ascii=False, allow_nan=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETADATA
          if [[ -e dist/release/metadata-snapshot.json ]]; then
            diff -u dist/release/metadata-snapshot.json "$candidate"
          else
            mv "$candidate" dist/release/metadata-snapshot.json
          fi

      - name: Validate vulnerability reports
        run: &validate-vulnerability-reports |
          set -euo pipefail
          evidence_dir=dist/release
          [[ -d dist/release/evidence ]] && evidence_dir=dist/release/evidence
          report_args=()
          for component in frontend runtime-base bottle-fetcher catalog-extractor materializer; do
            for platform in linux/amd64 linux/arm64; do
              slug=${platform//\//-}
              report="$evidence_dir/vulnerability-${component}-${slug}.json"
              test -s "$report"
              subject=$(jq -er --arg component "$component" --arg platform "$platform" \
                '.components[$component].repository + "@" + .components[$component].platforms[$platform]' \
                dist/release/digests.json)
              report_args+=("$report" "$subject")
            done
          done
          python3 - "${report_args[@]}" <<'PYVULN'
          import json
          import os
          from pathlib import Path
          import sys

          max_bytes = int(os.environ["MAX_RELEASE_ASSET_BYTES"])

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON member {key!r}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant {value}")

          if (len(sys.argv) - 1) % 2 != 0:
              raise SystemExit("vulnerability validator requires report/subject pairs")

          for index in range(1, len(sys.argv), 2):
              path = Path(sys.argv[index])
              expected_subject = sys.argv[index + 1]
              try:
                  size = path.stat().st_size
                  if size <= 0 or size > max_bytes:
                      raise ValueError(f"report size {size} is outside the allowed range")
                  with path.open("rb") as source:
                      data = source.read(max_bytes + 1)
                  if len(data) != size or len(data) > max_bytes:
                      raise ValueError("report size changed or exceeded the limit while reading")
                  document = json.loads(
                      data.decode("utf-8"),
                      object_pairs_hook=unique_object,
                      parse_constant=reject_constant,
                  )
                  if not isinstance(document, dict) or document.get("SchemaVersion") != 2:
                      raise ValueError("unexpected Trivy schema")
                  if document.get("ArtifactName") != expected_subject:
                      raise ValueError("Trivy ArtifactName does not match the expected subject")
                  if document.get("ArtifactType") != "container_image":
                      raise ValueError("Trivy ArtifactType is not container_image")
                  metadata = document.get("Metadata")
                  if not isinstance(metadata, dict):
                      raise ValueError("Trivy Metadata is not an object")
                  repo_digests = metadata.get("RepoDigests")
                  if not isinstance(repo_digests, list) or expected_subject not in repo_digests:
                      raise ValueError("Trivy RepoDigests does not contain the expected subject")
                  results = document.get("Results")
                  if not isinstance(results, list) or not results:
                      raise ValueError("Trivy Results is not a nonempty array")
                  for result in results:
                      if not isinstance(result, dict):
                          raise ValueError("Trivy result is not an object")
                      if not isinstance(result.get("Target"), str) or not result["Target"]:
                          raise ValueError("Trivy result Target is missing")
                      vulnerabilities = result.get("Vulnerabilities")
                      if vulnerabilities is None:
                          continue
                      if not isinstance(vulnerabilities, list):
                          raise ValueError("Trivy Vulnerabilities is not an array")
                      for vulnerability in vulnerabilities:
                          if not isinstance(vulnerability, dict):
                              raise ValueError("Trivy vulnerability is not an object")
              except (OSError, UnicodeError, ValueError) as exc:
                  raise SystemExit(f"{path}: invalid vulnerability report: {exc}")
          PYVULN

      - name: Generate SLSA provenance predicate
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          workflow_git_ref=${WORKFLOW_REF##*@}
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$RELEASE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg workflow_ref "$workflow_git_ref" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --slurpfile digests dist/release/digests.json \
            --slurpfile inputs dist/release/inputs.json \
            '($inputs[0].dalec_frontend.index
              | capture("^(?<repository>[^@]+)@sha256:(?<digest>[0-9a-f]{64})$")) as $dalec_frontend
            | {
              builder: {id: "https://github.com/actions/runner"},
              buildType: ("https://github.com/" + $repository + "/.github/workflows/release.yml@v1"),
              invocation: {
                configSource: {
                  uri: ("git+https://github.com/" + $repository + "@" + $workflow_ref),
                  digest: {sha1: $workflow_sha},
