name: release tag

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  dispatch:
    name: Dispatch trusted release
    if: github.event.created && !github.event.deleted && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch release workflow from main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF_TYPE" != tag || "$TAG_CREATED" != true || "$TAG_DELETED" != false || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "release tag dispatcher requires an initial tag push" >&2
            exit 1
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release tag dispatcher has an invalid commit: $EXPECTED_SHA" >&2
            exit 1
          }

          gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[tag]=$RELEASE_TAG" \
            -f "inputs[expected_sha]=$EXPECTED_SHA"
